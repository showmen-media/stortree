---
# Filtered, host-specific rclone.conf: only the remote sections this
# host's resolved role actually needs, plus a synthesized sftp section
# per peer dependency (spec.md §3). The master rclone.conf never leaves
# the control node.

- name: Look up membership for every group referenced in an access grant
  # A per-user peer dependency's %U has to be expanded to the real
  # username actually granted access before its synthesized sftp section
  # can point at the right path (spec.md §3) -- the same group_members
  # map stortree_mounts needs for its own %U expansion (spec.md §2),
  # resolved once here since this is the first role in site.yml's order
  # that needs it (runs after stortree_identity, so SSSD is already
  # configured); stortree_mounts reuses this same `stortree_group_members`
  # fact rather than re-deriving its own. Covers every node with a group
  # grant, not just per-user ones -- a plain shared node's `access.group`
  # still needs its GID resolved to gid-own its mount (spec.md §6), even
  # though it has no %U-expansion to do.
  #
  # `register`-d rather than relying on the resulting
  # `ansible_facts.getent_group` fact directly: looping the module (one
  # invocation per group name) means each iteration's own returned
  # `ansible_facts.getent_group` only contains *that one* group, and
  # replaces (not merges into) the host's whole fact each time --
  # Ansible's default fact-merge behaviour, `hash_behaviour: replace`,
  # applies here same as anywhere else, and nothing in this project's
  # ansible.cfg overrides it. With more than one group ever needed at
  # once, only the last loop iteration's group would actually survive in
  # `ansible_facts.getent_group` by the time anything reads it --
  # `stortree_merge_getent()` (filter_plugins/stortree.py) rebuilds the
  # real, complete `{name: fields}` map from this task's own `.results`
  # instead, sidestepping the clobbered fact entirely.
  ansible.builtin.getent:
    database: group
    key: "{{ item }}"
  loop: "{{ stortree | stortree_needed_groups }}"
  register: stortree_secrets_group_lookups
  tags: [secrets]

- name: Compute this host's resolved group membership
  # Moved ahead of the UID lookup below (it used to follow it) --
  # stortree_needed_users() now also needs to know every per-user
  # container's real owner (group-derived ones included, e.g. a
  # group-only grant's members), which needs this fact to exist first.
  ansible.builtin.set_fact:  # noqa: var-naming[no-role-prefix]
    stortree_group_members: >-
      {{ stortree_secrets_group_lookups.results
         | stortree_merge_getent('group')
         | stortree_group_members }}
  tags: [secrets]

- name: Compute this host's resolved group GIDs
  # Same merged lookup data as above, just the numeric GID instead of
  # membership -- stortree_mounts needs it to gid-own a remote-backed
  # node's rclone mount when `access` grants a group (spec.md §6), so the
  # kernel can enforce that grant for real.
  ansible.builtin.set_fact:  # noqa: var-naming[no-role-prefix]
    stortree_group_gids: >-
      {{ stortree_secrets_group_lookups.results
         | stortree_merge_getent('group')
         | stortree_group_gids }}
  tags: [secrets]

- name: Look up the UID for every user referenced in an access.owner grant
  # Mirrors the group lookup above -- stortree_mounts needs the numeric
  # UID (not just the name) to uid-own a remote-backed node's mount
  # (spec.md §6); a plain local node just hands ansible.builtin.file the
  # name directly and needs no lookup at all. Passing stortree_group_
  # members (just computed above) also covers every per-user container's
  # own owner, group-derived ones included -- stortree_mounts needs their
  # numeric UIDs too, for a wrapper mount's --uid (user_container_paths(),
  # filter_plugins/stortree.py).
  #
  # `register`-d for the same reason as the group lookup above -- see
  # its own comment. This is the task that actually surfaced the bug in
  # production: sys-configs-style single-owner grants never needed more
  # than one name looped before user_container_paths() started covering
  # group-derived container owners too, so this was the first time more
  # than one name was ever looped here.
  ansible.builtin.getent:
    database: passwd
    key: "{{ item }}"
  loop: "{{ stortree | stortree_needed_users(stortree_group_members) }}"
  register: stortree_secrets_user_lookups
  tags: [secrets]

- name: Compute this host's resolved user UIDs
  # Same idea as stortree_group_gids, for access.owner instead of
  # access.group.
  ansible.builtin.set_fact:  # noqa: var-naming[no-role-prefix]
    stortree_user_uids: >-
      {{ stortree_secrets_user_lookups.results
         | stortree_merge_getent('passwd')
         | stortree_user_uids }}
  tags: [secrets]

- name: Render this host's filtered rclone.conf
  ansible.builtin.copy:
    content: >-
      {{ lookup('file', stortree_rclone_conf_path)
         | stortree_filter_rclone_conf(stortree, hostvars, stortree_group_members) }}
    dest: "{{ stortree_etc }}/rclone.conf"
    owner: "{{ stortree_user }}"
    group: "{{ stortree_group }}"
    mode: "0600"
  no_log: true
  tags: [secrets]
