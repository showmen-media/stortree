---
# Applies each resolved `access` grant with ansible.posix.acl, directly
# on the physical path, on whichever host actually serves that subtree
# (spec.md §6) -- POSIX-level, so it governs access uniformly whether the
# path is reached via Samba, SSH, or a local process. Reuses
# stortree_plan_mounts' path expansion (same one stortree_mounts uses)
# so a user-subdirs grant is applied at every authorized user's own
# expanded path (docs/plan.md interpretation call #2), not a shared
# %U-templated path that doesn't exist on disk.
#
# ACLs are naturally idempotent to reapply with the same spec, so this
# always recomputes and reapplies from the resolved facts rather than
# diffing against a previous run.

- name: Install acl
  ansible.builtin.apt:
    name: acl
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [acl]

- name: Compute this host's flat mount plan (path + access, per user where applicable)
  # stortree_group_members (resolved by stortree_secrets, which always
  # runs before this role -- site.yml §8) covers every group referenced
  # in a per-user access grant, whether this host owns the node
  # (server_subtrees) or peer-sources it (peer_dependencies) -- both get
  # %U-expanded here, so a peer-sourced per-user directory gets the same
  # ACLs applied locally as one this host owns outright.
  ansible.builtin.set_fact:
    stortree_acl_plan: "{{ stortree | stortree_plan_mounts(stortree_group_members) }}"
  tags: [acl]

- name: Flatten access grants to one (path, grant) pair per task
  ansible.builtin.set_fact:
    stortree_acl_targets: >-
      {{ stortree_acl_plan
         | subelements('access', skip_missing=true) }}
  tags: [acl]

- name: Apply effective ACLs
  ansible.posix.acl:
    path: "{{ stortree_root }}/{{ item.0.local_path }}"
    etype: "{{ 'user' if 'user' in item.1 else 'group' }}"
    entity: "{{ item.1.user | default(item.1.group) }}"
    permissions: "{{ item.1.permissions }}"
    recursive: true
    default: false
    state: present
  loop: "{{ stortree_acl_targets }}"
  loop_control:
    label: "{{ item.0.local_path }}: {{ item.1 }}"
  tags: [acl]

- name: Apply matching default ACLs (so new files/dirs inherit the grant)
  ansible.posix.acl:
    path: "{{ stortree_root }}/{{ item.0.local_path }}"
    etype: "{{ 'user' if 'user' in item.1 else 'group' }}"
    entity: "{{ item.1.user | default(item.1.group) }}"
    permissions: "{{ item.1.permissions }}"
    recursive: true
    default: true
    state: present
  loop: "{{ stortree_acl_targets }}"
  loop_control:
    label: "{{ item.0.local_path }}: {{ item.1 }}"
  tags: [acl]
