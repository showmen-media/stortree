---
# SSSD against the LDAP server in stortree/ldap.yml, purely for POSIX
# identity (spec.md §5). Not specific to any particular LDAP product.

- name: Load stortree/ldap.yml
  ansible.builtin.set_fact:
    stortree_identity_ldap: "{{ lookup('file', stortree_ldap_path) | from_yaml }}"
  no_log: true
  tags: [identity]

- name: Install sssd
  ansible.builtin.apt:
    name: sssd
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [identity]

- name: Render sssd.conf
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    group: root
    mode: "0600"
  notify: stortree sssd.conf changed
  no_log: true
  tags: [identity]

- name: Ensure sssd is enabled and running
  # The handler above only restarts sssd when this task's render is
  # `changed` -- a host whose config already matched (e.g. sssd never got
  # started after a fresh install, or the service died/was stopped some
  # other way) would otherwise stay down indefinitely, since systemd
  # doesn't retry a service on its own and nothing else in this role ever
  # asks it to start. This runs unconditionally every apply so it
  # self-heals regardless of why the service is down.
  ansible.builtin.systemd_service:
    name: sssd
    enabled: true
    state: started
  tags: [identity]
