---
# Stacks a sync script into the host's PAM auth/password chain, after
# SSSD's own module, so a successful PAM auth (SSH login, sudo, ...)
# or password change also syncs that user's Samba NT-hash entry with
# their LDAP password (spec.md §5 -- Samba's `security = user` needs
# an NT-compatible hash, not a plain LDAP bind, and this is the
# ready-made answer that doesn't require the LDAP server to maintain
# the Samba schema itself).
#
# This used to be Samba's own pam_smbpass.so (package libpam-smbpass),
# spec.md's originally documented answer -- but upstream Samba dropped
# pam_smbpass in 4.4, and Debian/Ubuntu removed the package along with
# it, years before any of this role's supported platforms (Debian
# bookworm, Ubuntu jammy/noble) existed. It is not installable on any
# of them. pam_exec.so (ships in libpam-modules, always present)
# stacked with `expose_authtok` is the modern replacement: it hands
# the plaintext credential to files/pam-smbpass-sync.sh on stdin,
# which drives `smbpasswd -s -a` the same way pam_smbpass used to.
#
# Declarative/idempotent via community.general.pamd (spec.md says
# ansible.builtin.pamd; the module has always shipped in
# community.general, not ansible-core, so that's what's actually used
# here) rather than hand-patching /etc/pam.d/common-auth -- BUT pamd
# only handles the single line it's told to insert; it doesn't know
# that a `success=N` jump-count on an *earlier* line was tuned assuming
# nothing sits between that line and pam_deny.so. Inserting a new
# module there without also renumbering those earlier jump-counts
# means a successful pam_unix/pam_winbind/pam_sss auth falls through
# and lands on `pam_deny.so requisite`, which always fails and aborts
# the whole stack -- i.e. a correct password gets rejected. Both
# chains below explicitly fix those counts (verified against this
# host's actual /etc/pam.d/common-{auth,password} -- re-verify if the
# stack ever gains/loses a provider) rather than relying on pamd to
# figure it out. Read straight from community.general's pamd.py before
# relying on any of this: `control` is a required match key for every
# state (including `updated`/`absent`, not just `before`/`after`), and
# `module_path` for matching an *existing* rule must be the bare path
# only (e.g. `pam_unix.so`) -- the file parser splits path from
# trailing module arguments via regex, so a combined "path args" string
# never matches anything and silently no-ops (`new_module_path`, used
# only to construct a brand new line, is the one place a combined
# string is fine).
#
# Each chain also unconditionally removes any existing copy of the
# sync-script line before reinserting exactly one, rather than trusting
# pamd's own before/after duplicate check -- that's what let this line
# get inserted repeatedly in the past (4 copies observed in the wild)
# despite the check existing in pamd's source. This way the sequence
# self-heals to the same correct end state regardless of whether a host
# has never been touched, is mid-way through the old broken config, or
# has already been fixed by a previous run.
#
# `optional` (rather than pam_smbpass's old `sufficient`) is
# deliberate: this module is a side effect, not a source of truth for
# whether auth/password-change succeeds, so it must never be able to
# short-circuit or gate the rest of the stack. `seteuid` matters most
# for the password-chain stacking: `passwd` is setuid root, so its
# real UID is the invoking user and only the effective UID is root --
# without `seteuid`, pam_exec would run the sync script as that user,
# who can't write the local smbpasswd database.
#
# The password chain's pam_sss.so line uses the simple `sufficient`
# control rather than a `success=N` jump count: on success it returns
# immediately to the caller, bypassing everything after it in the
# stack. Inserting the sync script *after* it (mirroring the auth
# chain) would mean the sync script never runs for an LDAP-driven
# password change at all -- the exact case this whole role exists for.
# So the password chain inserts it *before* pam_sss instead, where it's
# reached unconditionally regardless of which provider ultimately
# succeeds.

- name: Install samba-common-bin (smbpasswd)
  ansible.builtin.apt:
    name: samba-common-bin
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [pam_smbpass]

- name: Deploy the Samba NT-hash sync script
  ansible.builtin.copy:
    src: pam-smbpass-sync.sh
    dest: /usr/local/sbin/stortree-pam-smbpass-sync
    owner: root
    group: root
    mode: "0700"
  tags: [pam_smbpass]

- name: Remove any previously-stacked sync script from the auth chain
  community.general.pamd:
    name: common-auth
    type: auth
    control: optional
    module_path: pam_exec.so
    state: absent
  tags: [pam_smbpass]

- name: Fix the pam_unix/pam_winbind/pam_sss jump counts in the auth chain so a success can't fall through into the sync script and pam_deny.so
  community.general.pamd:
    name: common-auth
    type: auth
    control: "[success={{ item.old }} default=ignore]"
    module_path: "{{ item.module_path }}"
    new_control: "[success={{ item.new }} default=ignore]"
    state: updated
  loop:
    - { module_path: pam_unix.so, old: 3, new: 4 }
    - { module_path: pam_winbind.so, old: 2, new: 3 }
    - { module_path: pam_sss.so, old: 1, new: 2 }
  loop_control:
    label: "{{ item.module_path }}"
  tags: [pam_smbpass]

- name: Stack the sync script into the auth chain, after pam_sss
  community.general.pamd:
    name: common-auth
    type: auth
    control: "[success=2 default=ignore]"
    module_path: pam_sss.so
    new_type: auth
    new_control: optional
    new_module_path: pam_exec.so expose_authtok seteuid /usr/local/sbin/stortree-pam-smbpass-sync
    state: after
  tags: [pam_smbpass]

- name: Remove any previously-stacked sync script from the password chain
  community.general.pamd:
    name: common-password
    type: password
    control: optional
    module_path: pam_exec.so
    state: absent
  tags: [pam_smbpass]

- name: Fix the pam_unix/pam_winbind jump counts in the password chain so a success can't fall through into the sync script and pam_deny.so
  # pam_sss.so itself needs no adjustment here: it uses plain `sufficient`
  # rather than a success=N jump count, so its position relative to
  # pam_deny.so doesn't matter.
  community.general.pamd:
    name: common-password
    type: password
    control: "[success={{ item.old }} default=ignore]"
    module_path: "{{ item.module_path }}"
    new_control: "[success={{ item.new }} default=ignore]"
    state: updated
  loop:
    - { module_path: pam_unix.so, old: 3, new: 4 }
    - { module_path: pam_winbind.so, old: 2, new: 3 }
  loop_control:
    label: "{{ item.module_path }}"
  tags: [pam_smbpass]

- name: Stack the sync script into the password chain, before pam_sss
  community.general.pamd:
    name: common-password
    type: password
    control: sufficient
    module_path: pam_sss.so
    new_type: password
    new_control: optional
    new_module_path: pam_exec.so expose_authtok seteuid /usr/local/sbin/stortree-pam-smbpass-sync
    state: before
  tags: [pam_smbpass]
