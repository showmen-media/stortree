---
# Stacks a sync script into the host's PAM auth/password chain so a
# successful PAM auth (SSH login, sudo, ...) or password change also
# syncs that user's Samba NT-hash entry with their LDAP password
# (spec.md §5 -- Samba's `security = user` needs an NT-compatible hash,
# not a plain LDAP bind, and this is the ready-made answer that doesn't
# require the LDAP server to maintain the Samba schema itself).
#
# This used to be Samba's own pam_smbpass.so (package libpam-smbpass),
# spec.md's originally documented answer -- but upstream Samba dropped
# pam_smbpass in 4.4, and Debian/Ubuntu removed the package along with
# it, years before any of this role's supported platforms (Debian
# bookworm, Ubuntu jammy/noble) existed. It is not installable on any
# of them. pam_exec.so (ships in libpam-modules, always present)
# stacked with `expose_authtok` is the modern replacement: it hands
# the credential to files/pam-smbpass-sync.sh on stdin, which drives
# `smbpasswd -s -a` the same way pam_smbpass used to.
#
# *Where* in the chain the script sits is the whole point, and the
# earlier version of this role got it backwards. The script trusts
# whatever credential it is handed -- it has no way to tell a correct
# password from a typo -- so it must only ever be reached after a
# Primary module (pam_unix/pam_sss) has accepted that credential. The
# old role inserted it between pam_sss and pam_deny.so and bumped the
# `success=N` jump counts to keep a successful auth off pam_deny.so;
# the bumped counts jumped the script too, so it ran only when every
# module had *failed*. Net effect: a correct login never synced, and a
# failed one -- a typo, or anyone's guess -- became that user's Samba
# password.
#
# pam-auth-update already has a slot with exactly the semantics
# needed: the "Additional" block, rendered after the `requisite
# pam_deny.so` / `required pam_permit.so` pair. The only way there is a
# Primary module succeeding and jumping over pam_deny.so; a failure
# hits pam_deny.so, which is requisite and aborts the stack. So the
# script ships as a pam-auth-update profile (files/pam-config) rather
# than as lines patched into common-{auth,password}, and pam-auth-
# update computes every jump count itself. That also means
# stortree_samba's `pam-auth-update --force`, which runs just before
# this role, now preserves the line instead of wiping it.
#
# One exception pam-auth-update can't express: the distro sss profile
# stacks pam_sss.so in the *password* chain as plain `sufficient`,
# which on success returns straight to the caller and never reaches
# the Additional block -- so an LDAP user's password change would never
# sync. A task below rewrites that one control to the jump equivalent
# of `sufficient` that lands on pam_permit.so instead of returning.
# That edit is a local modification pam-auth-update doesn't know
# about, so stortree_samba's regeneration undoes it every apply and
# this role redoes it: that task reports `changed` every run. If
# anything else regenerates the file in between, the password-change
# sync stops for LDAP users until the next apply; auth sync is
# unaffected, and nothing about it can sync a wrong password.
#
# `optional` is deliberate: this module is a side effect, not a source
# of truth for whether auth/password-change succeeds, so it must never
# be able to gate the rest of the stack. `seteuid` matters for the
# password chain: `passwd` is setuid root, so its real UID is the
# invoking user and only the effective UID is root -- without
# `seteuid`, pam_exec would run the sync script as that user, who can't
# write the local smbpasswd database.

- name: Install samba-common-bin (smbpasswd)
  ansible.builtin.apt:
    name: samba-common-bin
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [pam_smbpass]

- name: Deploy the Samba NT-hash sync script
  ansible.builtin.copy:
    src: pam-smbpass-sync.sh
    dest: /usr/local/sbin/stortree-pam-smbpass-sync
    owner: root
    group: root
    mode: "0700"
  tags: [pam_smbpass]

- name: Deploy the sync script's pam-auth-update profile
  ansible.builtin.copy:
    src: pam-config
    dest: /usr/share/pam-configs/stortree-smbpass-sync
    owner: root
    group: root
    mode: "0644"
  register: stortree_pam_smbpass_profile
  tags: [pam_smbpass]

# Exits non-zero unless each chain holds exactly one sync line, and it
# sits after pam_permit.so -- i.e. in the Additional block, reachable
# only on success. Anything else is either a fresh host or a host still
# carrying the old role's layout.
- name: Check that the sync script is stacked only on the success path
  ansible.builtin.shell: |
    for f in /etc/pam.d/common-auth /etc/pam.d/common-password; do
      awk '/^[[:space:]]*#/ { next }
           /pam_permit\.so/ { permit = 1 }
           /stortree-pam-smbpass-sync/ { n++; if (!permit) bad = 1 }
           END { exit (bad || n != 1) }' "$f" || exit 1
    done
  register: stortree_pam_smbpass_stack
  changed_when: false
  failed_when: false
  tags: [pam_smbpass]

# The old role's lines are local modifications that pam-auth-update
# does not reliably remove on its own, and one left sitting before
# pam_deny.so while pam-auth-update recomputes the jump counts around
# it would put pam_deny.so on the *success* path -- locking every
# password login out. Remove every copy first, then regenerate from
# the profiles, which puts back exactly one, in the right place.
- name: Remove any stacked copy of the sync script before regenerating
  ansible.builtin.lineinfile:
    path: "/etc/pam.d/{{ item }}"
    regexp: 'stortree-pam-smbpass-sync'
    state: absent
  loop: [common-auth, common-password]
  when: stortree_pam_smbpass_profile.changed or stortree_pam_smbpass_stack.rc != 0
  tags: [pam_smbpass]

- name: Enable the sync profile and regenerate the PAM chains
  # DEBIAN_FRONTEND=noninteractive for the same reason stortree_samba
  # gives it: --force alone does not stop pam-auth-update's
  # whiptail/dialog frontend from waiting on a tty that never comes.
  ansible.builtin.command: pam-auth-update --force --enable stortree-smbpass-sync
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: true
  when: stortree_pam_smbpass_profile.changed or stortree_pam_smbpass_stack.rc != 0
  tags: [pam_smbpass]

# `sufficient` is `[success=done new_authtok_reqd=done default=ignore]`;
# this keeps everything but `success`, which now jumps over the
# pam_deny.so that pam-auth-update renders directly after the last
# Primary module (pam_sss sorts last: its profile priority is below
# pam_unix's). The check below verifies that adjacency rather than
# trusting it.
- name: Let a successful pam_sss password change reach the sync script
  community.general.pamd:
    name: common-password
    type: password
    control: sufficient
    module_path: pam_sss.so
    new_control: "[success=1 new_authtok_reqd=done default=ignore]"
    state: updated
  tags: [pam_smbpass]

- name: Check the resulting PAM chains
  ansible.builtin.shell: |
    for f in /etc/pam.d/common-auth /etc/pam.d/common-password; do
      awk '/^[[:space:]]*#/ { next }
           /pam_permit\.so/ { permit = 1 }
           /stortree-pam-smbpass-sync/ { n++; if (!permit) bad = 1 }
           END { exit (bad || n != 1) }' "$f" \
        || { echo "$f: sync script is not stacked exactly once after pam_permit.so"; exit 1; }
    done
    awk '/^[[:space:]]*#/ || !NF { next }
         sss { if (!/pam_deny\.so/) bad = 1; sss = 0 }
         $1 == "password" && /pam_sss\.so/ { sss = 1; if (/sufficient/) bad = 1 }
         END { exit bad }' /etc/pam.d/common-password \
      || { echo "common-password: pam_sss.so is not a success jump directly over pam_deny.so"; exit 1; }
  changed_when: false
  tags: [pam_smbpass]
