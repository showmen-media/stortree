---
# Local `stortree` service account + the fixed mount root and per-host
# state directory (spec.md §7). A plain local account, not resolved via
# LDAP/SSSD -- it exists purely to own mount processes and any
# peer-to-peer SSH relationship, independent of any human identity.

- name: Create the stortree group
  ansible.builtin.group:
    name: "{{ stortree_group }}"
    system: true
    state: present
  register: stortree_group_created
  tags: [common]

- name: Create the stortree service account
  ansible.builtin.user:
    name: "{{ stortree_user }}"
    group: "{{ stortree_group }}"
    system: true
    home: "{{ stortree_home }}"
    create_home: false
    shell: /usr/sbin/nologin
    state: present
  register: stortree_user_created
  tags: [common]

- name: Record the stortree account's own numeric uid/gid
  # Needed by stortree_mounts to force consistent stortree:stortree
  # ownership on a mount that other mounts nest inside (see that role's
  # own comment on why) -- pulled straight from the create-account tasks'
  # own registered result rather than a separate getent lookup, since
  # they already resolve it as a side effect of ensuring the account
  # exists.
  ansible.builtin.set_fact:
    stortree_uid: "{{ stortree_user_created.uid }}"
    stortree_gid: "{{ stortree_group_created.gid }}"
  tags: [common]

- name: Ensure the stortree service account has a home directory
  # stortree_peer_trust puts the peer authorized_keys under
  # {{ stortree_home }}/.ssh, so this has to exist before it runs.
  ansible.builtin.file:
    path: "{{ stortree_home }}"
    state: directory
    owner: "{{ stortree_user }}"
    group: "{{ stortree_group }}"
    mode: "0750"
  tags: [common]

- name: Read this host's mount table
  # Read straight out of the kernel rather than taken from
  # `ansible_facts.mounts`, for the same two reasons stortree_mounts
  # gives -- correctness and cost.
  #
  # Correctness: Ansible's mount-fact gathering drops any mount whose
  # device string neither starts with "/" nor contains ":/", which
  # silently loses rclone's own mounts depending on whether the remote
  # path happens to begin with a slash.
  #
  # Cost: that gathering also calls statvfs() on every mount to get its
  # size, which on an rclone mount is a round trip to the backend, and
  # on a dead one never returns at all. It is bounded by `gather_timeout`
  # (10s by default) and a fleet with a stuck mount paid all ten seconds
  # of it on every host on every play, plus a screenful of "Timeout
  # exceeded when getting mount info" warnings. This task was the only
  # reader of those facts in the whole repo; with it reading mountinfo
  # instead, ansible.cfg switches the hardware collector off entirely.
  ansible.builtin.slurp:
    src: /proc/self/mountinfo
  register: stortree_common_mountinfo
  tags: [common]

- name: Ensure the fixed mount root exists
  # Skipped once `stortree_root` is itself already an active mountpoint.
  # Nothing stortree resolves ever mounts there any more (every path
  # starts at a named top-level subtree), but an operator can still give
  # `/srv/stortree` its own dedicated filesystem -- and it used to be the
  # normal case, back when the whole tree hung off one shared root a
  # non-owning host peer-mounted whole (`local_path == ""`).
  #
  # The skip matters because a mount
  # still running a unit rendered before --allow-other became
  # unconditional (stortree_mounts' own header comment) is reachable
  # only by the mounting user (stortree) -- root included, when this
  # host's own root lacks CAP_SYS_ADMIN (true inside an unprivileged LXC
  # container, which is what actually surfaced this: root couldn't even
  # stat the live mount). Ansible (running as root) can no longer stat
  # this path once that's the case, and `ansible.builtin.file` doesn't
  # treat "exists but I can't see it" as already-satisfied -- it falls
  # through to a raw create and dies on the mount's own EEXIST. That
  # window closes for good on the apply that restarts the unit, but the
  # skip stays right either way: nothing to ensure once
  # something's already mounted there, so check the mount table read
  # above (this play's own view of it, i.e. whatever the previous apply
  # already set up, not anything stortree_mounts changes later in this
  # same run) and skip outright rather than touch a path this host can
  # no longer even see.
  ansible.builtin.file:
    path: "{{ stortree_root }}"
    state: directory
    owner: "{{ stortree_user }}"
    group: "{{ stortree_group }}"
    # 0751, not 0750: every real `access` grant anywhere in the tree sits
    # underneath this one root, so it needs the same public-execute
    # traversal bit stortree_mounts/access_mode() now put on every other
    # unmodeled container -- otherwise no LDAP-authenticated user (never
    # a member of the local `stortree` group) can ever reach a grant no
    # matter how permissive that grant itself is (spec.md §6).
    mode: "0751"
  when: >-
    stortree_root not in (stortree_common_mountinfo.content | b64decode
                          | stortree_mountinfo_targets)
  tags: [common]

- name: Ensure the per-host rendered-state directory exists
  ansible.builtin.file:
    path: "{{ stortree_etc }}"
    state: directory
    owner: "{{ stortree_user }}"
    group: "{{ stortree_group }}"
    mode: "0750"
  tags: [common]
