---
# Local `stortree` service account + the fixed mount root and per-host
# state directory (spec.md §7). A plain local account, not resolved via
# LDAP/SSSD -- it exists purely to own mount processes and any
# peer-to-peer SSH relationship, independent of any human identity.

- name: Create the stortree group
  ansible.builtin.group:
    name: "{{ stortree_group }}"
    system: true
    state: present
  tags: [common]

- name: Create the stortree service account
  ansible.builtin.user:
    name: "{{ stortree_user }}"
    group: "{{ stortree_group }}"
    system: true
    home: "{{ stortree_home }}"
    create_home: false
    shell: /usr/sbin/nologin
    state: present
  tags: [common]

- name: Ensure the stortree service account has a home directory (peer_trust's authorized_keys lives under {{ stortree_home }}/.ssh)
  ansible.builtin.file:
    path: "{{ stortree_home }}"
    state: directory
    owner: "{{ stortree_user }}"
    group: "{{ stortree_group }}"
    mode: "0750"
  tags: [common]

- name: Ensure the fixed mount root exists
  # Skipped once `stortree_root` is itself already an active mountpoint
  # -- true on any host with a whole-tree root client mount (a
  # client_mounts entry, local_path == "", spec.md §1): that mount
  # carries no `access` of its own (stortree_mounts' plan_mounts()
  # always resolves the root client entry with access: {}), so it never
  # gets --allow-other, and only the mounting user (stortree) can reach
  # it at all -- root included, when this host's own root lacks
  # CAP_SYS_ADMIN (true inside an unprivileged LXC container, which is
  # what actually surfaced this: root couldn't even stat the live mount).
  # Ansible (running as root) can no longer stat this path once that's
  # the case, and `ansible.builtin.file` doesn't treat "exists but I
  # can't see it" as already-satisfied -- it falls through to a raw
  # create and dies on the mount's own EEXIST. Nothing to ensure once
  # something's already mounted there, so check `ansible_facts.mounts`
  # (gathered at this play's own start, i.e. reflecting whatever the
  # previous apply already set up, not anything stortree_mounts changes
  # later in this same run) and skip outright rather than touch a path
  # this host can no longer even see.
  ansible.builtin.file:
    path: "{{ stortree_root }}"
    state: directory
    owner: "{{ stortree_user }}"
    group: "{{ stortree_group }}"
    mode: "0750"
  when: stortree_root not in (ansible_facts.mounts | map(attribute='mount') | list)
  tags: [common]

- name: Ensure the per-host rendered-state directory exists
  ansible.builtin.file:
    path: "{{ stortree_etc }}"
    state: directory
    owner: "{{ stortree_user }}"
    group: "{{ stortree_group }}"
    mode: "0750"
  tags: [common]
