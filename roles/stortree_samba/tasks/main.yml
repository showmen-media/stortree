---
# Every task here is gated on this host being in `stortree_samba_hosts`
# (roles/stortree_facts/defaults/main.yml), which defaults to the whole
# fleet -- "Samba sharing is universal" (config-schema.md) stays the
# baseline, and an operator narrows the list for a host that has no
# business serving SMB. The gate is only half the opt-out: resolve()
# reads the same list and returns no `samba_shares` *and* no samba peer
# dependencies for an excluded host, so it also stops peer-mounting
# content purely to back shares it no longer exports (see resolve()'s
# docstring in filter_plugins/stortree.py -- that mount, not the
# smb.conf stanza, is what universality actually costs).
#
# The discovery tasks in the second half are gated on that same list and
# then on `stortree_samba_discovery*` (defaults/main.yml) on top of it:
# a host that exports nothing has nothing to announce, so "not serving"
# always implies "not announcing", never the other way round. Each
# protocol's teardown path is written as the negation of its setup path
# rather than only running on an excluded host, so turning a flag off
# converges a host that previously had it on.

- name: Collect service facts before stopping anything this host no longer runs
  # Only to answer "is there a unit here to stop?" below -- a host that
  # never served Samba has no smbd, one that never announced over WSD
  # has neither wsdd.service nor wsdd2.service, and systemd_service
  # would fail on any of them rather than cleanly doing nothing.
  # Gathered whenever some teardown path can run, which is any of: the
  # host is out of Samba service entirely, or one of the discovery
  # protocols is switched off.
  #
  # The one teardown that does *not* use this is retiring an announcer
  # the host ran under the other implementation's unit name, which is
  # reachable with every flag still on and so cannot be gated here; it
  # asks a narrower question anyway, and asks it with its own `stat`.
  ansible.builtin.service_facts:
  when: >-
    inventory_hostname not in stortree_samba_hosts
    or not stortree_samba_discovery
    or not stortree_samba_discovery_wsd
    or not stortree_samba_discovery_mdns
    or not stortree_samba_discovery_netbios
  tags: [samba]

- name: Stop and disable smbd on a host excluded from stortree_samba_hosts
  # Converges a host that *used* to serve shares and has since been
  # removed from the list. Without this it would keep exporting the last
  # smb.conf this role rendered, whose share paths point at peer mounts
  # resolve() no longer resolves -- shares backed by nothing, which is a
  # worse state than either serving or not serving.
  #
  # The package and /etc/samba/smb.conf are deliberately left in place:
  # removing a package and a config file the operator may also use for
  # something else is not this role's call, and a stopped, disabled smbd
  # already exports nothing. Delete both by hand if the host is done
  # with Samba for good.
  ansible.builtin.systemd_service:
    name: smbd
    state: stopped
    enabled: false
  when:
    - inventory_hostname not in stortree_samba_hosts
    - "'smbd.service' in (ansible_facts.services | default({}))"
  tags: [samba]

- name: Stop and disable nmbd where this host must not announce over NetBIOS
  # The unmanaged half of Samba, until now: the `samba` package's own
  # postinst enables *and starts* nmbd next to smbd, and its
  # ExecCondition (`is-configured nmb`) only declines on an AD DC or
  # under `disable netbios = yes`, neither of which stortree sets. So
  # every host this role ever touched has been announcing itself into
  # the workgroup whether or not anything asked it to -- including,
  # before this task existed, hosts dropped from stortree_samba_hosts,
  # which kept answering name queries for shares they had stopped
  # exporting.
  ansible.builtin.systemd_service:
    name: nmbd
    state: stopped
    enabled: false
  when:
    - >-
      inventory_hostname not in stortree_samba_hosts
      or not (stortree_samba_discovery and stortree_samba_discovery_netbios)
    - "'nmbd.service' in (ansible_facts.services | default({}))"
  tags: [samba]

- name: Stop and disable the WS-Discovery announcer where this host must not run one
  # Before the unit file is removed below, not after: once the render is
  # gone and systemd has reloaded, `systemctl stop wsdd` on a platform
  # whose package ships no unit of its own (Ubuntu noble) fails on a
  # unit that no longer exists. Same order as stortree_mounts' own
  # stale-unit sweep, for the same reason.
  #
  # Both unit names, not just the one this host would render today: the
  # two WSD daemons are packaged under different unit names, so a host
  # that changed implementations (an in-place bookworm-to-trixie upgrade
  # is the realistic way) would otherwise leave the other one enabled,
  # started and announcing with the distro's own defaults. The
  # service-facts guard means naming a unit this host never had costs
  # nothing.
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ stortree_samba_wsdd_units }}"
  when:
    - >-
      inventory_hostname not in stortree_samba_hosts
      or not (stortree_samba_discovery and stortree_samba_discovery_wsd)
    - "item ~ '.service' in (ansible_facts.services | default({}))"
  tags: [samba]

- name: Remove the WS-Discovery units stortree renders
  # On bookworm and jammy this uncovers the distro package's own unit
  # again (wsdd.service.j2 explains the shadowing), which the task above
  # has just disabled -- so it stays down across reboots and across a
  # package upgrade, since deb-systemd-helper does not re-enable a unit
  # an admin disabled. The package itself is left installed, the same
  # call this role makes for `samba` on a host that stops serving.
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service"
    state: absent
  loop: "{{ stortree_samba_wsdd_units }}"
  notify: stortree wsdd unit changed
  when: >-
    inventory_hostname not in stortree_samba_hosts
    or not (stortree_samba_discovery and stortree_samba_discovery_wsd)
  tags: [samba]

- name: Withdraw this host's mDNS advertisement
  # Removing the file is the whole of it: avahi-daemon is left running,
  # because unlike wsdd it is a general-purpose daemon this host may
  # publish other things through, and because a host that has stopped
  # advertising SMB has not necessarily stopped advertising.
  ansible.builtin.file:
    path: /etc/avahi/services/stortree-smb.service
    state: absent
  notify: stortree mdns advertisement changed
  when: >-
    inventory_hostname not in stortree_samba_hosts
    or not (stortree_samba_discovery and stortree_samba_discovery_mdns)
  tags: [samba]

- name: Install samba
  ansible.builtin.apt:
    name: samba
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600
  when: inventory_hostname in stortree_samba_hosts
  tags: [samba]

- name: Remove winbind
  # samba Recommends: winbind, which apt pulls in by default -- and
  # libpam-winbind's postinst auto-registers its own PAM profile via
  # pam-auth-update, entangling pam_winbind into every login on the host
  # (auth, account, password, session) even though nothing here ever
  # asked for it. This host runs standalone `security = user` Samba with
  # no domain join (smb.conf.j2), so winbindd has no legitimate role --
  # but it still exposes the machine's own local SAM (the same tdbsam
  # database stortree_pam_smbpass's sync script writes to) as a
  # pseudo-domain named after the host's NetBIOS name, and pam_winbind
  # authenticates against *that* instead of LDAP/SSSD, silently
  # rewriting the PAM username to `<NETBIOS-NAME>\<user>` on success --
  # which breaks every later PAM phase and every getpwnam() call that
  # expects the plain LDAP username. `install_recommends: false` above
  # stops it from being pulled back in; this removes it from hosts where
  # it already landed.
  ansible.builtin.apt:
    name:
      - winbind
      - libpam-winbind
      - libnss-winbind
    state: absent
    autoremove: true
  when: inventory_hostname in stortree_samba_hosts
  tags: [samba]

- name: Regenerate PAM profiles now that winbind is gone
  # Removing libpam-winbind above does *not* retroactively clean up the
  # pam_winbind.so lines it registered into common-{auth,account,password,
  # session} via pam-auth-update on install -- those files are owned by
  # libpam-runtime, not libpam-winbind, and nothing here observed forced
  # its postrm to re-run pam-auth-update. A stale pam_winbind.so
  # reference is at best noisy (PAM logs "unable to dlopen" and treats it
  # as a faulty module); at worst -- as seen in common-account, whose
  # `pam_unix.so` "Primary block" falls through into an unconditional
  # `pam_deny.so requisite` for any LDAP-only user before ever reaching
  # the real pam_sss.so check further down -- the file's structure is
  # broken enough that hand-patching individual lines with pamd risks
  # missing something. pam-auth-update itself knows how to correctly
  # fold whichever profiles are actually installed (unix + sss, now that
  # winbind's profile file is gone with the package) into all four
  # common-* files, so let it do that instead of us reverse-engineering
  # the correct shape for account/session by hand. `--force` is the
  # documented non-interactive form (the same one package postinst/
  # postrm scripts use), safe for unattended runs. This wipes any custom
  # line stortree_pam_smbpass previously stacked into common-auth/
  # common-password -- that role runs immediately after this one in
  # site.yml's role order and re-inserts it idempotently every apply, so
  # that's expected and harmless. Runs unconditionally (not gated on the
  # removal task's changed-ness) so it also converges a host that already
  # had winbind removed by an earlier apply, and self-heals against any
  # future drift in these files -- idempotent from the system's
  # perspective either way, since it always regenerates the same correct
  # output from whichever profiles are currently installed. `--force`
  # only means "reinstall even if it looks unchanged" -- it does not by
  # itself suppress pam-auth-update's interactive whiptail/dialog
  # frontend, which can hang indefinitely waiting for input that will
  # never arrive over Ansible's non-tty command execution.
  # DEBIAN_FRONTEND=noninteractive is what actually forces it to run
  # unattended.
  ansible.builtin.command: pam-auth-update --force
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: true
  when: inventory_hostname in stortree_samba_hosts
  tags: [samba]

- name: Render smb.conf (validated with testparm before it's written)
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
    validate: "testparm -s %s"
  notify: stortree smb.conf changed
  when: inventory_hostname in stortree_samba_hosts
  tags: [samba]

- name: Ensure smbd is enabled and running
  # The handler above only reloads smbd when this task's render is
  # `changed` -- reloading a service that was never started (fresh
  # install) or that later died/was stopped some other way would fail or
  # silently do nothing, since nothing else in this role ever asks it to
  # start. This runs unconditionally every apply so it self-heals
  # regardless of why the service is down.
  ansible.builtin.systemd_service:
    name: smbd
    enabled: true
    state: started
  when: inventory_hostname in stortree_samba_hosts
  tags: [samba]

# -- host discovery -------------------------------------------------------

- name: Ensure nmbd is enabled and running
  # A no-op on a host that already had it, which is every host this role
  # has ever run on (see the stop task above for why). What changes is
  # that the state is now stortree's rather than the package's: the
  # smb.conf handler reloads nmbd alongside smbd, so a `workgroup`
  # change reaches the announcements and not just the shares.
  ansible.builtin.systemd_service:
    name: nmbd
    enabled: true
    state: started
  when:
    - inventory_hostname in stortree_samba_hosts
    - stortree_samba_discovery
    - stortree_samba_discovery_netbios
  tags: [samba]

- name: Refresh the apt cache before asking it which WSD daemon exists
  # The pick below reads `apt-cache policy`, which answers from whatever
  # is on disk: on a host whose cache predates the release it is running
  # -- or has never been updated at all -- it would report no candidate
  # for either daemon and the assert below would blame the platform for
  # a stale file. Same `cache_valid_time` as every other apt task in
  # this role, so a run that has already refreshed does not do it twice.
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false
  when:
    - inventory_hostname in stortree_samba_hosts
    - stortree_samba_discovery
    - stortree_samba_discovery_wsd
  tags: [samba]

- name: Ask apt which WS-Discovery daemons this platform packages
  # `wsdd` and `wsdd2` are different programs solving the same problem,
  # and which one exists is a property of the archive rather than of the
  # release name: Debian shipped `wsdd` through bookworm and only
  # `wsdd2` from trixie on, and the Ubuntus keep `wsdd` in `universe`,
  # which a host may not have enabled. Asking apt covers every one of
  # those without a codename table that would need editing for each new
  # release -- and it is also the check that makes a host with `universe`
  # disabled fail with something an operator can act on, rather than
  # with apt's bare "no package" from an install task.
  ansible.builtin.command:
    cmd: apt-cache policy wsdd wsdd2
  register: stortree_samba_wsd_policy
  changed_when: false
  check_mode: false
  when:
    - inventory_hostname in stortree_samba_hosts
    - stortree_samba_discovery
    - stortree_samba_discovery_wsd
    - stortree_samba_wsd_implementation == 'auto'
  tags: [samba]

- name: Settle on a WS-Discovery implementation for this host
  # `wsdd` first where both are somehow installable: it is what every
  # platform this role supported before trixie ran, it takes the
  # interface list this role already models in full, and it needs no
  # capabilities. wsdd2 is the fallback, not the preference.
  #
  # A pinned `stortree_samba_wsd_implementation` skips the probe above
  # and is taken at its word -- including onto a platform that does not
  # package it, where the install below then fails with apt's own error.
  # That is the intended behaviour of pinning: an operator who named one
  # wants that one or a failure, not a silent substitution.
  ansible.builtin.set_fact:
    stortree_samba_wsdd_flavour: >-
      {{ stortree_samba_wsd_implementation
         if stortree_samba_wsd_implementation != 'auto'
         else (stortree_samba_wsd_policy.stdout
               | stortree_apt_installable(['wsdd', 'wsdd2'])
               + ['wsdd'])
              | first }}
  when:
    - inventory_hostname in stortree_samba_hosts
    - stortree_samba_discovery
    - stortree_samba_discovery_wsd
  tags: [samba]

- name: Refuse a WS-Discovery implementation this platform does not package
  # Separated from the install below so the message names the actual
  # problem. apt's own failure here reads "No package matching 'wsdd' is
  # available", which says nothing about there being a second daemon
  # that would have worked, nor about `universe` -- the two things an
  # operator meeting this needs to know. (This is the failure a trixie
  # host hit the first time one joined a fleet whose other nodes were on
  # bookworm.)
  ansible.builtin.assert:
    that: >-
      stortree_samba_wsd_implementation != 'auto'
      or (stortree_samba_wsd_policy.stdout
          | stortree_apt_installable(['wsdd', 'wsdd2'])) | length > 0
    fail_msg: >-
      Neither `wsdd` nor `wsdd2` is installable on this host, so there is
      no WS-Discovery daemon to run. On Ubuntu, `wsdd` lives in
      `universe` -- enable it. On Debian it is `wsdd` up to bookworm and
      `wsdd2` from trixie; if neither resolves, the apt cache is
      reaching neither `main` nor this release. Set
      stortree_samba_discovery_wsd to false to leave WS-Discovery off on
      this host in the meantime -- mDNS and NetBIOS announcements are
      unaffected.
  when:
    - inventory_hostname in stortree_samba_hosts
    - stortree_samba_discovery
    - stortree_samba_discovery_wsd
  tags: [samba]

- name: Refuse an interface list wsdd2 cannot express
  # wsdd2's -i is a single interface *name*; wsdd's --interface repeats
  # and also takes addresses. Dropping the extras would leave the host
  # announcing on every interface -- the exact opposite of what naming
  # one asks for, and invisible in the rendered unit -- so this fails
  # instead.
  ansible.builtin.assert:
    that: stortree_samba_wsd_interfaces | length <= 1
    fail_msg: >-
      stortree_samba_wsd_interfaces names
      {{ stortree_samba_wsd_interfaces | length }} interfaces, and this
      host runs wsdd2, whose -i takes exactly one. Narrow it to a single
      interface name for this host (host_vars), or leave it empty to
      announce on all of them.
  when:
    - inventory_hostname in stortree_samba_hosts
    - stortree_samba_discovery
    - stortree_samba_discovery_wsd
    - stortree_samba_wsdd_flavour == 'wsdd2'
  tags: [samba]

- name: Install the WS-Discovery daemon
  ansible.builtin.apt:
    name: "{{ stortree_samba_wsdd_flavour }}"
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600
  when:
    - inventory_hostname in stortree_samba_hosts
    - stortree_samba_discovery
    - stortree_samba_discovery_wsd
  tags: [samba]

- name: Find the WS-Discovery binary this platform installed
  # /usr/sbin/wsdd on bookworm and jammy, /usr/bin/wsdd on noble,
  # /usr/sbin/wsdd2 on trixie. The unit has to name an absolute path, so
  # the difference has to be resolved here rather than assumed -- a
  # wrong path is a unit that fails at every start with status=203/EXEC.
  ansible.builtin.find:
    paths:
      - /usr/bin
      - /usr/sbin
    patterns: "{{ stortree_samba_wsdd_flavour }}"
    file_type: any
  register: stortree_samba_wsdd_found
  changed_when: false
  when:
    - inventory_hostname in stortree_samba_hosts
    - stortree_samba_discovery
    - stortree_samba_discovery_wsd
  tags: [samba]

- name: Refuse to render a WS-Discovery unit with no binary to run
  # Its own task, ahead of the set_fact below, so the failure reads as
  # the thing that is actually wrong: taking `first` of an empty find
  # inside that set_fact fails too, but as a Jinja error about a
  # sequence, which is a worse thing to meet in a log.
  ansible.builtin.assert:
    that: stortree_samba_wsdd_found.files | length > 0
    fail_msg: >-
      The {{ stortree_samba_wsdd_flavour }} package is installed but no
      {{ stortree_samba_wsdd_flavour }} binary was found in /usr/bin or
      /usr/sbin (it is /usr/sbin/wsdd on bookworm and jammy,
      /usr/bin/wsdd on noble, /usr/sbin/wsdd2 on trixie). Set
      stortree_samba_discovery_wsd to false to leave WS-Discovery off on
      this host in the meantime.
  when:
    - inventory_hostname in stortree_samba_hosts
    - stortree_samba_discovery
    - stortree_samba_discovery_wsd
  tags: [samba]

- name: Settle on the wsdd binary path
  # `| sort | first` rather than "whichever the find happened to return
  # first": on a merged-/usr host both paths can name the same file, and
  # a unit whose ExecStart flips between two spellings of one binary
  # would re-render and restart the announcer on alternate applies.
  ansible.builtin.set_fact:
    stortree_samba_wsdd_bin: >-
      {{ stortree_samba_wsdd_found.files | map(attribute='path') | sort | first }}
  when:
    - inventory_hostname in stortree_samba_hosts
    - stortree_samba_discovery
    - stortree_samba_discovery_wsd
  tags: [samba]

- name: Retire the announcer this host used to run under another name
  # The teardown at the top of this file only fires when WS-Discovery is
  # switched *off*. A host that keeps it on but changes implementation
  # never reaches it -- and that is the likely case, not a contrived
  # one: an in-place Debian bookworm-to-trixie upgrade takes `wsdd` away
  # and offers `wsdd2` instead, with `stortree_samba_discovery_wsd`
  # untouched throughout. Without this the host would come out of that
  # upgrade with stortree's old wsdd.service still enabled (now with no
  # binary behind it, so failing on every boot) next to the new one.
  #
  # The presence of stortree's own render at the other unit's path is
  # the whole test, and a narrower one than the service facts the
  # teardown at the top of this file uses: a render there means this
  # role put it there, which means systemd knows that unit and it is
  # safe to stop. Absent, there is nothing of stortree's to retire --
  # any unit of that name left is the distro package's own, in
  # /lib/systemd/system, which this role never started and must not stop.
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}.service"
  loop: >-
    {{ stortree_samba_wsdd_units | reject('equalto', stortree_samba_wsdd_unit)
       | list }}
  register: stortree_samba_wsdd_superseded
  changed_when: false
  when:
    - inventory_hostname in stortree_samba_hosts
    - stortree_samba_discovery
    - stortree_samba_discovery_wsd
  tags: [samba]

- name: Stop the announcer this host used to run under another name
  # Stopped before its file is removed, the same order as the teardown
  # at the top of this file and for the same reason.
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    state: stopped
    enabled: false
  loop: "{{ stortree_samba_wsdd_superseded.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  when:
    - inventory_hostname in stortree_samba_hosts
    - stortree_samba_discovery
    - stortree_samba_discovery_wsd
    - item.stat.exists | default(false)
  tags: [samba]

- name: Remove the render behind an announcer this host no longer runs
  # Removing it uncovers the distro package's own unit, which lives in
  # /lib/systemd/system -- the same relationship the teardown path at
  # the top of this file has, and the reason a `systemctl disable` has
  # to have come first: deb-systemd-helper will not re-enable a unit an
  # admin disabled, so it stays down across reboots and upgrades.
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.item }}.service"
    state: absent
  loop: "{{ stortree_samba_wsdd_superseded.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  notify: stortree wsdd unit changed
  when:
    - inventory_hostname in stortree_samba_hosts
    - stortree_samba_discovery
    - stortree_samba_discovery_wsd
    - item.stat.exists | default(false)
  tags: [samba]

- name: Render the WS-Discovery unit
  # Shadows the distro package's own unit where it ships one -- under
  # that package's own unit name, which is why the destination follows
  # the flavour rather than being fixed at wsdd.service. Rendering
  # stortree's announcer as `wsdd.service` on a trixie host would leave
  # the packaged `wsdd2.service` enabled and running beside it: two
  # announcers, one of them stortree's and one of them the distro's
  # defaults. See the template's header for why shadowing is the
  # arrangement rather than a second unit name plus a mask. No
  # `validate:` equivalent exists for a systemd unit, so the guard on
  # this one's correctness is the render test in tests/test_templates.py.
  ansible.builtin.template:
    src: wsdd.service.j2
    dest: "/etc/systemd/system/{{ stortree_samba_wsdd_unit }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: stortree wsdd unit changed
  when:
    - inventory_hostname in stortree_samba_hosts
    - stortree_samba_discovery
    - stortree_samba_discovery_wsd
  tags: [samba]

- name: Ensure the WS-Discovery announcer is enabled and running
  # `daemon_reload` here rather than a flushed handler before it: on a
  # first apply the unit file has only just been written, and enabling
  # or starting a unit systemd has not read yet is the difference
  # between an announcer that comes up now and one that comes up at the
  # next reboot. Same self-healing reason as smbd's own task above.
  ansible.builtin.systemd_service:
    name: "{{ stortree_samba_wsdd_unit }}"
    enabled: true
    state: started
    daemon_reload: true
  when:
    - inventory_hostname in stortree_samba_hosts
    - stortree_samba_discovery
    - stortree_samba_discovery_wsd
  tags: [samba]

- name: Install avahi-daemon
  # Recommends deliberately left out: the weightiest of them is
  # libnss-mdns, which rewires this host's *own* name resolution to
  # resolve .local through mDNS. Publishing a record and resolving other
  # people's are different things, and only the first is what this role
  # was asked for.
  ansible.builtin.apt:
    name: avahi-daemon
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600
  when:
    - inventory_hostname in stortree_samba_hosts
    - stortree_samba_discovery
    - stortree_samba_discovery_mdns
  tags: [samba]

- name: Publish this host's SMB service over mDNS
  ansible.builtin.template:
    src: stortree-smb.avahi.xml.j2
    dest: /etc/avahi/services/stortree-smb.service
    owner: root
    group: root
    mode: "0644"
  notify: stortree mdns advertisement changed
  when:
    - inventory_hostname in stortree_samba_hosts
    - stortree_samba_discovery
    - stortree_samba_discovery_mdns
  tags: [samba]

- name: Ensure avahi-daemon is enabled and running
  ansible.builtin.systemd_service:
    name: avahi-daemon
    enabled: true
    state: started
  when:
    - inventory_hostname in stortree_samba_hosts
    - stortree_samba_discovery
    - stortree_samba_discovery_mdns
  tags: [samba]
