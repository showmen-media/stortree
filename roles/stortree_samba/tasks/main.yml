---
- name: Install samba
  ansible.builtin.apt:
    name: samba
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [samba]

- name: Render smb.conf (validated with testparm before it's written)
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
    validate: "testparm -s %s"
  notify: stortree smb.conf changed
  tags: [samba]

- name: Ensure smbd is enabled and running
  # The handler above only reloads smbd when this task's render is
  # `changed` -- reloading a service that was never started (fresh
  # install) or that later died/was stopped some other way would fail or
  # silently do nothing, since nothing else in this role ever asks it to
  # start. This runs unconditionally every apply so it self-heals
  # regardless of why the service is down.
  ansible.builtin.systemd_service:
    name: smbd
    enabled: true
    state: started
  tags: [samba]
