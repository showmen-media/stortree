---
- name: Install samba
  ansible.builtin.apt:
    name: samba
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [samba]

- name: Render smb.conf (validated with testparm before it's written)
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
    validate: "testparm -s %s"
  notify: stortree smb.conf changed
  tags: [samba]
