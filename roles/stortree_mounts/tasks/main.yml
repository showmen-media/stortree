---
# WHAT HAPPENS HERE, IN ORDER
#
# This role is the one with real ordering constraints -- most of them
# discovered the hard way, and each explained at its own task below. The
# map first, so the sequence is readable without reading the rationale;
# the rationale then follows, and the individual tasks carry the rest.
#
#   1. install the mount stack -- rclone from apt or from the pinned
#      upstream release, per stortree_rclone_install -- and allow
#      non-mounting users through FUSE
#   2. compute the flat mount plan + per-user container ownership
#   3. sweep stale units  ---- before any path creation, so a path that
#      used to be a mount is a plain empty directory by the time
#      anything tries to bind onto it
#   4. probe which resolved mountpoints are active but unreachable
#      ("masked"), and skip those paths for the rest of the run
#   5. create directories: parents, mountpoints/plain dirs, per-user
#      staging dirs, bind mountpoints and their parents  ---- every one
#      of these is `ignore_errors: true`; see below for why that is
#      load-bearing rather than sloppy
#   6. chown plain-local per-user containers to their one real user
#   7. render units: mounts, per-user wrapper mounts, per-user binds
#      (in that order -- a wrapper has to exist before what nests in it)
#   8. restart units whose file actually changed -- plus the transports,
#      if step 1 replaced the rclone binary under them -- then
#      enable+start all
#   9. re-stat every path step 5 was supposed to create, and report
#      (or, under `stortree_mounts_strict`, fail on) whatever is still
#      missing  ---- the counterweight to step 5's ignore_errors
#
# Steps 3 and 5 and step 9 are a set: the sweep has to precede creation,
# creation can't be fatal, and so the verification has to come last.
#
# One rclone-mount@<slug>.service per resolved mount (server subtree,
# client mount, or peer-sourced samba descendant this host doesn't own --
# mesh-sourced directly from whichever host actually owns it, spec.md
# §1/§2), resolving a user-subdirs entry's %U-templated path against its
# own `access` grant (spec.md §2, docs/plan.md interpretation call #2):
# an `owner` grant still gets one real mount at that one user's own path;
# a `group`-only grant instead gets exactly one real, shared mount (at
# `stortree_plan_mounts`' hidden `.mounts` path for that node) plus one
# bind mount per member fanning it back out to each member's own folder
# (a real symlink can't do this job when the member's own folder lives on
# a remote-backed node itself -- see the per-user bind-mount tasks below
# for why) -- see `per_user_mount_path()` in filter_plugins/stortree.py
# for why one mount now serves every member instead of one full duplicate each
# (N members used to mean N redundant rclone procs/VFS caches of
# identical content, with no cache coherency between them, even though
# the access grant behind every one of those duplicates was always the
# same single group).
# Ansible's own idempotence (template only rewrites on change,
# systemd_service only touches state that's out of sync) covers most of
# what a hand-rolled reconciler would otherwise need to implement -- but
# not quite all of it: `systemd_service: state: started` is a no-op for
# a unit that's already active, so a changed ExecStart alone never
# reaches an already-running mount without an explicit restart (below);
# and a "stale unit no longer in the resolved set" needs an explicit
# cleanup step too -- run *before* path creation below, not after: a
# node that used to be a real per-user mount (before this host had any
# `.mounts`-collapsed group grant, or before a member left a group) and
# is now instead the destination of a per-user bind mount has to have
# its old per-user unit stopped and unmounted first, or that still-busy
# mountpoint directory ends up bind-mounted on top of yet another live
# mount instead of the plain, empty directory a bind mount needs to
# start from.
#
# Every directory-creation task below is `ignore_errors: true`
# for exactly this reason too, not just to route around a masked
# ancestor: a path nested under a mount whose *own* config just changed
# (a corrected `rclone.remote`, say) can't be created until that mount
# is actually re-rendered and restarted with the fix -- which happens
# further down this same file. Ansible aborts the whole play for a host
# on a task's first unhandled failure, so a real, non-masked failure
# here (not just a skip) would permanently block this file from ever
# reaching the render/restart step that would fix the *actual* problem
# -- a stale mount stopping its own fix from ever being applied, forever
# repeating the identical failure on every subsequent run regardless of
# how many times the underlying config gets corrected (production hit
# exactly this: a top-level subtree's `rclone.remote` got fixed twice in
# a row, and the live unit never picked up either fix, because a nested
# entry's directory creation kept failing first and aborting the play
# before render/restart ever ran). Letting these fail non-fatally costs
# nothing more than one extra apply -- the same "two-run" pattern this
# design already has for a brand-new nested entry generally (its own
# parent mount has to exist and be reachable before anything can be
# created inside it, same as always).
#
# `rclone` never inherits down the tree (docs/config-schema.md "Node
# inheritance"), so not every entry in the flat mount plan is an actual
# rclone mount -- an entry with no `remote` is either a plain directory
# that has to exist (either nested inside an ancestor's mount, or kept as
# real local storage on its resolved host) or a per-user bind mount
# fanning a `group`-only node's one shared mount back out to a member's
# own folder (`symlink_target` set -- the field name predates the switch
# from a real symlink to a bind mount, see filter_plugins/stortree.py's
# plan_mounts() docstring for why) -- neither has an rclone unit of its
# own; only entries with a `remote` get one below, and only entries with
# a `symlink_target` get a stortree-bind@ unit further down.
#
# Every plain directory (no `remote`) gets its Unix owner/group/mode set
# from its own `access` grant (spec.md §6, stortree_access_owner/_group/
# _mode): with neither `owner` nor `group` granted, that's the plain
# default (owner stortree, full control; group stortree, read+traverse;
# other execute-only) every path had before `access` existed, plus a
# public-execute traversal bit (access_mode() in filter_plugins/
# stortree.py) -- without it, an ordinary LDAP-authenticated user (never
# a member of the local `stortree` group) can't even `chdir()` through
# this ancestor to reach a real grant nested underneath it, no matter how
# permissive that grant itself is: every directory component on the path
# needs its own execute bit, and Samba/SSH access both run as that real
# user post-privilege-drop, subject to the same kernel checks as anyone
# else. A remote-backed node's own mountpoint directory does NOT follow
# `access` this way -- it stays stortree:stortree 0751 no matter what's
# granted, since the grant is enforced by the mount that covers it
# instead (see below), and the account that actually performs that mount
# is unconditionally `stortree` (User= in the unit template), never the
# grant's own `owner`; chowning the pre-mount directory to a granted
# `owner` leaves `stortree` with no bits on it at all, and `fusermount`
# refuses to mount there ("Permission denied") before the grant it was
# chasing ever becomes visible. A per-user bind-mount entry carries no
# `access` of its own either (it's enforced once, at the real mount
# `symlink_target` points to, exactly as a symlink's target enforcement
# would have been) -- but unlike a symlink, its own mountpoint directory
# is a real, separate inode that has to be creatable and traversable in
# its own right before anything can be bound onto it, so it still gets
# the same plain stortree:stortree 0751 default as any other unmodeled
# container path (no `access`-driven chown/chmod needed -- what's
# actually visible once mounted is entirely the bound-in target's own
# enforcement, unaffected by this directory's own ownership once
# something's mounted over it). A
# remote-backed node's mount renders --allow-other and --dir-perms/
# --file-perms unconditionally, from the same three filters as the
# plain-directory case above, so the two always agree: an *ungranted*
# mount presents the same stortree:stortree 0751 an ungranted local
# directory does (--uid/--gid fall through to the mounting process's
# own, which is unconditionally stortree), a granted one presents its
# grant. `other` gets the same traversal-only bit either way, never
# read.
#
# That unconditional --allow-other is what keeps root able to reach a
# mountpoint at all, and it has to come from this flag or nowhere:
# without it FUSE restricts a mount to the mounting user (stortree)
# alone -- no other local process, including root, an SSH session from
# an LDAP-authenticated user, or Ansible itself on a later apply, can
# reach it -- and rclone's own `--allow-root` (the documented way to
# widen a private mount to "mounting user and root", the same
# relationship a plain local directory's default owner/group already
# gives root implicitly) is silently ignored by the rclone build this
# fleet runs ("Ignoring --allow-root. Support has been removed
# upstream", rclone logs this on every mount attempt). An ungranted
# mount used to be gated the same way a granted one is, which made it
# permanently unreachable to root by construction -- and a VFS-cache
# subtree (docs/config-schema.md's `.bravo-cache` pattern) is exactly
# that shape, since no `access` grant is meaningful on a cache: it
# masked itself on every apply, forever, with no later apply able to
# widen a grant that was never meant to exist. A mount can still be
# masked *transiently* -- a host running a unit rendered before this
# change keeps its old, private mount until something restarts it (this
# file's own render/restart tasks, one apply later) -- so every task
# below that touches an already-resolved path still probes whether root
# can actually reach a remote-backed entry's own mountpoint before
# touching it (below -- a direct `stat`, not `ansible_facts.mounts`,
# which silently drops some of this fleet's own mounts from its list
# regardless of how reachable they are, see the probe task's own
# comment) rather than let a live one's own EEXIST/permission errors
# surface as a task failure the way they used to. With a grant,
# the template additionally uid/gid-owns the mount directly (--uid/--gid
# from the grant rather than the mounting account)
# -- real kernel-enforced access, checked against whoever's
# actually connecting (smbd included, which runs as the real
# authenticated user, not a fixed service account, so this is enforced
# for Samba the same way it is for direct SSH). This is exactly what
# `access` can express and no more -- one owner, one group, one shared
# permissions level -- because that's all a remote-backed node can ever
# actually carry (rclone's FUSE mount has no POSIX ACL support at all),
# and the schema doesn't let you write anything broader than that
# (_normalize_access() rejects a list).

- name: Refuse an rclone source this role cannot install
  # Fail by name, here, rather than three tasks later on a 404 or on a
  # silently skipped install that leaves the units pointing at a binary
  # nobody put there. An unmapped architecture is the same class of
  # problem: stortree_rclone_arch_map is extendable precisely so this
  # says which key to add.
  ansible.builtin.assert:
    that:
      - stortree_rclone_install in ["apt", "upstream"]
      - >-
        stortree_rclone_install != "upstream"
        or ansible_facts["architecture"] in stortree_rclone_arch_map
    fail_msg: >-
      stortree_rclone_install must be apt or upstream
      (is {{ stortree_rclone_install }});
      and an upstream install needs this host's architecture
      ({{ ansible_facts["architecture"] }}) in stortree_rclone_arch_map.
    quiet: true
  tags: [mounts]

- name: Install the packaged part of the mount stack
  # bindfs is the presentation layer for per-user containers
  # (stortree-user-mount@.service.j2): it re-presents an already-mounted
  # local path under a forced owner, which is all a container needs and
  # which rclone was doing at ~47MB of resident memory per wrapper
  # against bindfs's ~1.6MB. See docs/layered-mounts.md "Why bindfs for
  # layer 2".
  #
  # rclone comes from apt only when stortree_rclone_install says so
  # (that default's own comment has the reasoning); `upstream` swaps it
  # for unzip, which the unarchive task below needs on the target, and
  # installs the pinned binary itself.
  #
  # An apt rclone already on an `upstream` host is deliberately left
  # installed rather than removed. Nothing points at it once the units
  # render stortree_rclone_bin, an unused 40MB binary is harmless, and
  # `state: absent` here would turn a typo'd stortree_rclone_install --
  # or a download that failed on one host -- into a host with no rclone
  # at all rather than a host still running the distro's.
  ansible.builtin.apt:
    name: >-
      {{ ['bindfs', 'fuse']
         + (['unzip'] if stortree_rclone_install == 'upstream' else ['rclone']) }}
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [mounts]

- name: Create the directory the upstream rclone release is staged in
  ansible.builtin.file:
    path: "{{ stortree_rclone_download_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: stortree_rclone_install == "upstream"
  tags: [mounts]

- name: Download the pinned upstream rclone release
  # get_url verifies `checksum:` against a dest that already exists and
  # skips the transfer when it matches, so this re-downloads only when
  # stortree_rclone_version moves -- which is also why the staging
  # directory is kept rather than cleaned up.
  #
  # A mismatch fails the task and leaves the running mounts alone: the
  # copy below never happens, so nothing under the live transports is
  # replaced by a file that wasn't what upstream published.
  ansible.builtin.get_url:
    url: >-
      {{ stortree_rclone_base_url }}/v{{ stortree_rclone_version }}/{{
         stortree_rclone_archive }}
    dest: "{{ stortree_rclone_download_dir }}/{{ stortree_rclone_archive }}"
    checksum: "{{ stortree_rclone_checksums[stortree_rclone_goarch] }}"
    owner: root
    group: root
    mode: "0644"
  when: stortree_rclone_install == "upstream"
  tags: [mounts]

- name: Unpack the pinned upstream rclone release
  ansible.builtin.unarchive:
    src: >-
      {{ stortree_rclone_download_dir }}/{{ stortree_rclone_archive }}
    dest: "{{ stortree_rclone_download_dir }}"
    remote_src: true
    creates: "{{ stortree_rclone_unpacked }}"
    owner: root
    group: root
    mode: "0755"
  when: stortree_rclone_install == "upstream"
  tags: [mounts]

- name: Install the upstream rclone binary
  # `copy` rather than a second unarchive target, because copy compares
  # checksums and so reports `changed` only when the binary on disk
  # actually differs from the one just unpacked. That result is what the
  # restart step at the end of this file reads to decide whether the
  # running transports are executing a stale binary -- an upgrade
  # changes no unit file, so nothing else in this role would notice.
  ansible.builtin.copy:
    src: "{{ stortree_rclone_unpacked }}"
    dest: "{{ stortree_rclone_bin }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  register: stortree_rclone_binary_installed
  when: stortree_rclone_install == "upstream"
  tags: [mounts]

- name: Note whether the rclone binary changed under the running mounts
  # Carried as its own fact rather than read off the register directly
  # at the restart step, which is ~500 lines below and has no business
  # knowing which task installed what. `default(false)` covers the apt
  # path, where the task above is skipped.
  ansible.builtin.set_fact:
    stortree_rclone_upgraded: >-
      {{ stortree_rclone_binary_installed.changed | default(false) | bool }}
  tags: [mounts]

- name: Allow FUSE mounts to grant access beyond the mounting user
  # A precondition for --allow-other, which every mount below now
  # renders (granted or not, this file's header comment) -- libfuse's
  # own fusermount refuses the option outright ("fusermount: option
  # allow_other only allowed if 'user_allow_other' is set in
  # /etc/fuse.conf") from a non-root mounting process (stortree, always
  # -- User= in the unit template) without this. Ahead of every other
  # task below -- an already-running mount that needed it would
  # otherwise have started without it (rclone doesn't retry a rejected
  # mount option, it just fails outright, spec.md's "Enable and start
  # every resolved mount" task's own failure mode) before this file ever
  # got the chance to fix that up. Now load-bearing for *every* mount
  # rather than only granted ones, so a host that somehow lost this line
  # would fail to mount anything at all rather than quietly falling back
  # to a private mount.
  ansible.builtin.lineinfile:
    path: /etc/fuse.conf
    regexp: '^#?\s*user_allow_other\s*$'
    line: user_allow_other
    create: true
    owner: root
    group: root
    mode: "0644"
  tags: [mounts]

- name: Read the rclone version this host actually has
  # Only to decide between the two metrics spellings, and only when the
  # operator left that on `auto`. The answer legitimately differs across
  # a fleet -- apt hosts get 1.60.1 on every Debian release there is,
  # upstream hosts get whatever stortree_rclone_version pins -- and
  # guessing wrong is not a missing counter but a mount that never
  # starts: rclone rejects an unknown flag outright and the transport
  # unit is Type=notify.
  #
  # stortree_rclone_bin, not a bare `rclone`: an upstream host has both
  # binaries installed (the apt one is left in place on purpose, see the
  # install task), so a PATH lookup here could read a version other than
  # the one the units below will actually execute -- and this probe's
  # whole job is to describe that binary.
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: "{{ stortree_rclone_bin }} version"
  register: stortree_metrics_rclone_version
  changed_when: false
  # Reads nothing but a version string, and has to run under --check
  # too: a skipped command leaves no stdout, which the decision below
  # would read as "too old to serve /metrics" and fail the assert on a
  # host that is perfectly fine. A dry run is documented in
  # docs/runbook.md and must not report that.
  check_mode: false
  when:
    - stortree_metrics_enabled
    - stortree_metrics_flavour == "auto"
  tags: [mounts]

- name: Decide which metrics flavour this host's rclone can serve
  # Falls back to `rc` when the version can't be parsed rather than to
  # the newer flag: `rc` works on every rclone that has ever had an rc
  # server, and the assert below keeps it from reaching the network
  # without authentication. The opposite fallback would take the mount
  # down on exactly the old hosts this exists to cope with.
  ansible.builtin.set_fact:
    stortree_metrics_mode: >-
      {{ stortree_metrics_flavour if stortree_metrics_flavour != "auto"
         else ("metrics-addr"
               if stortree_metrics_rclone_semver is version("1.68.0", ">=")
               else "rc") }}
  vars:
    stortree_metrics_rclone_semver: >-
      {{ stortree_metrics_rclone_version.stdout
         | default("", true)
         | regex_search("[0-9]+\.[0-9]+\.[0-9]+")
         | default("0.0.0", true) }}
  when: stortree_metrics_enabled
  tags: [mounts]

- name: Compute this host's flat mount plan
  # stortree_group_members (resolved by stortree_secrets, which always
  # runs before this role -- site.yml §8) covers every group referenced
  # in a per-user access grant, whether this host owns the node
  # (server_subtrees) or peer-sources it (peer_dependencies) -- both get
  # %U-resolved here into either one real mount per authorized user
  # (an `owner` grant) or one shared mount plus one bind mount per member
  # (a `group`-only grant).
  ansible.builtin.set_fact:
    stortree_mounts_plan: >-
      {{ stortree | stortree_plan_mounts(stortree_group_members, stortree_root) }}
  tags: [mounts]

- name: Allocate a metrics port and resolve the listen addresses for every mount
  # Both are pure functions with their own failure modes, run here so
  # they fail the apply at a controlled point rather than at
  # `systemctl start`: a port two mounts both want, or an interface name
  # that resolves to no address on this host, is a mount that does not
  # come up (rclone exits when it cannot bind; Type=notify) and takes
  # every presentation and bind above it down with it through PartOf=.
  #
  # Computed unconditionally, cheap either way, so the render task below
  # never has to reason about whether these exist -- the template reads
  # them only inside its own `stortree_metrics_enabled` guard.
  ansible.builtin.set_fact:
    stortree_metrics_ports: >-
      {{ stortree_mounts_plan
         | stortree_metrics_ports(stortree_metrics_base_port,
                                  stortree_metrics_port_span,
                                  stortree_metrics_port_overrides) }}
    stortree_metrics_listeners: >-
      {{ stortree_metrics_bind | stortree_metrics_listeners(ansible_facts) }}
  tags: [mounts]

- name: Refuse a metrics configuration that would publish this host's credentials
  # The `rc` flavour serves /metrics on the rc port, and the rc port
  # also serves config/dump -- which reads back the scoped rclone.conf
  # stortree_secrets put on this host, credentials for every backend it
  # mounts included. Loopback is not an exemption: every LDAP user with
  # a shell here is a local user, which is rather the point of the tree,
  # and an unauthenticated rc endpoint on 127.0.0.1 hands them the file
  # /etc/stortree's own 0750 exists to keep away from them.
  #
  # Fail-closed here rather than a warning, because the failure this
  # prevents is silent and permanent: nothing about a host serving its
  # own credentials on a port looks wrong afterwards.
  ansible.builtin.assert:
    that:
      - stortree_metrics_flavour in ["auto", "metrics-addr", "rc"]
      - not stortree_metrics_enabled or stortree_metrics_listeners | length > 0
      - >-
        not stortree_metrics_enabled
        or stortree_metrics_mode != "rc"
        or stortree_metrics_htpasswd is truthy
    fail_msg: >-
      stortree_metrics_flavour must be auto, metrics-addr or rc
      (is {{ stortree_metrics_flavour }});
      stortree_metrics_bind must name at least one address or interface
      when metrics are enabled;
      and the rc flavour -- which this host is on if its rclone predates
      1.68 -- requires stortree_metrics_htpasswd, because its endpoint
      serves config/dump alongside the counters.
    quiet: true
  tags: [mounts]

- name: Find currently installed stortree mount units
  # Run before any path is touched below (see this file's header comment)
  # -- a path that's switching roles between runs (real per-user mount ->
  # bind-mount destination, most notably) needs its old unit stopped and
  # unmounted *before* stortree_mounts_plan's new shape is applied to
  # disk, not after.
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns:
      - "stortree-remote@*.service"
      - "stortree-mount@*.service"
      - "stortree-bind@*.service"
  register: stortree_mounts_installed_units
  tags: [mounts]

- name: Determine stale units no longer in the resolved set
  ansible.builtin.set_fact:
    stortree_mounts_stale_units: >-
      {{ stortree_mounts_installed_units.files
         | map(attribute='path')
         | list
         | stortree_stale_units(stortree_mounts_plan) }}
  tags: [mounts]

- name: Stop and disable stale mount units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ stortree_mounts_stale_units }}"
  tags: [mounts]

- name: Remove stale mount unit files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop: "{{ stortree_mounts_stale_units }}"
  notify: stortree mounts changed
  tags: [mounts]

- name: Flush handlers so stale-unit removal is known to systemd before path creation
  ansible.builtin.meta: flush_handlers
  tags: [mounts]

- name: Clear failed-state bookkeeping for any stortree unit no longer backed by a file
  # `systemctl list-units --all` (what playbooks/status.yml reports) keeps
  # a unit's own last-known failed state around -- exactly the "not-found
  # failed failed" rows that command surfaces -- even after "Remove stale
  # mount unit files" above and its daemon-reload handler have made the
  # unit's *load* state `not-found`: daemon-reload only clears that load
  # state, not the separate failed-state bookkeeping, which needs its own
  # explicit reset. Scoped to every current *and historical*
  # stortree-mount@/stortree-bind@ slug, not just `stortree_mounts_stale_
  # units` above -- a unit whose file was already removed by an earlier
  # apply (before this task existed, or from an earlier schema/naming
  # iteration -- e.g. a bare `home/...` slug from before top-level
  # subtrees existed) never shows up in that set at all, since there's no
  # file left for "Find currently installed stortree mount units" to find.
  # Unconditional and idempotent every single apply: resetting a unit
  # that isn't actually in a failed state is a documented no-op, so this
  # costs nothing on a clean run and self-heals any accumulated ghost
  # state from any past slug family, not just whatever changed today.
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: >-
      systemctl reset-failed 'stortree-remote@*.service'
      'stortree-mount@*.service' 'stortree-bind@*.service'
  changed_when: false
  tags: [mounts]

- name: Probe whether each remote-backed entry's own mountpoint is reachable
  # `ansible_facts.mounts` can't be trusted for this -- Ansible's own
  # mount-fact gathering silently drops any mount whose reported device
  # string doesn't start with "/" and doesn't contain ":/"
  # (module_utils/facts/hardware/linux.py get_mount_facts(), a filter
  # meant to skip pseudo-filesystems like proc/tmpfs that report
  # non-path "device" names). rclone's own FUSE mounts report a bare
  # "remote:path" device string, and whether that string happens to
  # contain ":/" depends entirely on whether the remote path itself
  # starts with a "/" -- `some-remote:/.stortree-cache` mounts
  # with the reported device `some-remote:.stortree-cache` (no
  # "/" survives after the colon), which this fleet hit in production:
  # a live, healthy, currently-running mount, silently absent from
  # `ansible_facts.mounts` regardless, making any check built on that
  # fact unreliable for at least this remote and any other whose device
  # string happens to land the same way.
  #
  # A direct `stat` answers the actual question instead -- can Ansible
  # manage this path right now -- without caring how the mount reports
  # its own device string: it fails (`ignore_errors` below is what lets
  # that become a signal instead of aborting the run) exactly when a
  # mount sits there that this host's root can't reach (a mount still
  # running a unit rendered before --allow-other became unconditional,
  # this file's header comment; `ansible.builtin.stat`'s own
  # source only treats ENOENT specially -- anything else, permission
  # denied included, surfaces as the task failing outright), while
  # succeeding cleanly (`stat.exists: false`) for a path nothing's ever
  # mounted at yet, so a first-time mount still gets its directory
  # created normally below.
  ansible.builtin.stat:
    path: >-
      {{ (stortree_remotes_root if item.kind == 'transport' else stortree_root)
         ~ '/' ~ item.local_path }}
  loop: >-
    {{ stortree_mounts_plan
       | selectattr('kind', 'in', ['transport', 'mount']) | list }}
  loop_control:
    label: "{{ item.kind }} {{ item.local_path }}"
  register: stortree_mount_point_probe
  ignore_errors: true
  tags: [mounts]

- name: Note which resolved mount points are already active but unreachable
  ansible.builtin.set_fact:
    stortree_masked_mount_paths: >-
      {{ stortree_mount_point_probe.results
         | selectattr('failed')
         | map(attribute='item.local_path')
         | list }}
  tags: [mounts]

- name: Note which resolved mount points are already active and reachable
  # A live mount's own directory needs nothing further from this file --
  # it already exists, correctly owned, or it couldn't have mounted in
  # the first place. Its *parent* is exactly what the next task would
  # otherwise re-touch on every single apply from here on, and doing
  # that once something's actually mounted several levels beneath it
  # (a nested remote-backed entry, e.g. a peer-sourced samba descendant
  # under a top-level subtree) has turned out to be unsafe against at
  # least one backend in production: an SMB share choked with a bare
  # I/O error re-stat'ing a plain directory that had a live, unrelated
  # FUSE mount sitting inside it -- a working config that had applied
  # clean once broke on every subsequent run purely from touching that
  # parent again, nothing about the resolved plan having changed at
  # all. Skip ever revisiting an already-mounted entry's own parent
  # (next task) -- it was necessarily created and correctly owned
  # whenever the mount itself first came up; nothing about a `remote`
  # entry's own parent ownership is meant to change afterward anyway
  # (always stortree:stortree 0751, this file's header comment).
  ansible.builtin.set_fact:
    stortree_mounts_already_mounted_paths: >-
      {{ stortree_mount_point_probe.results
         | rejectattr('failed')
         | selectattr('stat.exists')
         | map(attribute='item.local_path')
         | list }}
  tags: [mounts]

- name: Note which paths are transport mountpoints
  # A transport's own mountpoint under the remotes root is a real local
  # directory; every *other* planned path under the remotes root
  # resolves inside a transport and therefore onto a backend. The two
  # need different treatment, and this is the cheapest way for the loops
  # below to tell them apart.
  ansible.builtin.set_fact:
    stortree_transport_paths: >-
      {{ stortree_mounts_plan | selectattr('kind', 'equalto', 'transport')
         | map(attribute='local_path') | list }}
  tags: [mounts]

- name: Ensure the remotes root exists
  # Layer 1 lives here: the raw, ungoverned view of every backend this
  # host mounts, outside stortree_root and never part of the visible
  # tree (docs/spec.md §2 "The two layers"). 0700 because every node is
  # visible here regardless of who was granted what -- only the service
  # account driving the presentation mounts above it, and root, have any
  # business in it.
  ansible.builtin.file:
    path: "{{ stortree_remotes_root }}"
    state: directory
    owner: "{{ stortree_user }}"
    group: "{{ stortree_group }}"
    mode: "0700"
  tags: [mounts]

- name: Ensure every transport mountpoint exists under the remotes root
  # Real local directories, created a level at a time by the plan's own
  # shallowest-first order so a nested transport's mountpoint is made
  # before the transport above it is asked to serve it.
  ansible.builtin.file:
    path: "{{ stortree_remotes_root ~ '/' ~ item.local_path }}"
    state: directory
    owner: "{{ stortree_user }}"
    group: "{{ stortree_group }}"
    mode: "0700"
  loop: >-
    {{ stortree_mounts_plan | selectattr('kind', 'equalto', 'transport') | list }}
  loop_control:
    label: "{{ item.local_path }}"
  when: not (item.local_path | stortree_path_masked(stortree_masked_mount_paths))
  ignore_errors: true
  tags: [mounts]

- name: Ensure every resolved path exists inside its transport
  # This is where directory creation actually lands now: the remotes
  # root mirrors the tree, so a node's real content sits at
  # <remotes_root>/<path>, on the backend, under exactly the name
  # config.yml gave it. Creating it here rather than in the visible tree
  # is what keeps a presentation mount from shadowing the directory a
  # nested mount is about to mount onto -- the failure that took out
  # every per-user bind on the first apply after presentation mounts
  # existed, when the two were different directories.
  #
  # Ownership and mode are deliberately uniform and are not the node's
  # grant: applying a grant here would mean chowning through the
  # transport's FUSE layer, which reports success and persists nothing.
  # The grant belongs to layer 2 (stortree-mount@.service.j2).
  #
  # Transport mountpoints are excluded -- the task above already made
  # them, and touching them again would be writing at the mount's own
  # root rather than into it.
  ansible.builtin.file:
    path: "{{ stortree_remotes_root ~ '/' ~ item.local_path }}"
    state: directory
    owner: "{{ stortree_user }}"
    group: "{{ stortree_group }}"
    mode: "0751"
  loop: >-
    {{ stortree_mounts_plan
       | rejectattr('kind', 'equalto', 'transport')
       | selectattr('transport_slug') | list }}
  loop_control:
    label: "{{ item.local_path }}"
  when:
    - item.local_path not in stortree_transport_paths
    - not (item.local_path | stortree_path_masked(stortree_masked_mount_paths))
  ignore_errors: true
  tags: [mounts]

- name: Ensure every path not covered by a presentation exists in the tree
  # What is left in the visible tree once layer 2 composes it: the
  # mountpoint of each top-level presentation, and every path of a
  # genuinely local subtree (`host` set, no `rclone.remote` anywhere
  # above it), which has no transport and so keeps living directly here.
  #
  # `requires_slug` is the test because it names the nearest presentation
  # above a path -- when there is none, nothing is going to compose this
  # path into view and it has to exist for real.
  ansible.builtin.file:
    path: "{{ stortree_root ~ '/' ~ item.local_path }}"
    state: directory
    owner: "{{ stortree_user }}"
    group: "{{ stortree_group }}"
    mode: "0751"
  loop: >-
    {{ stortree_mounts_plan
       | rejectattr('kind', 'equalto', 'transport')
       | rejectattr('requires_slug') | list }}
  loop_control:
    label: "{{ item.local_path }}"
  when: not (item.local_path | stortree_path_masked(stortree_masked_mount_paths))
  ignore_errors: true
  tags: [mounts]

- name: Own every genuinely local granted path by its own grant
  # The one case a plain chown still both applies and sticks: a node with
  # no transport anywhere above it is an ordinary directory on this
  # host's own disk, so real Unix ownership works and no mount is needed
  # to fake it. Everything else with a grant got a presentation mount
  # instead, because a chown through a FUSE layer reports `changed` and
  # persists nothing -- confirmed against a live deployment.
  #
  # Last, so it overrides whichever task above most recently touched the
  # same path with the uniform stortree:stortree default.
  ansible.builtin.file:
    path: "{{ stortree_root ~ '/' ~ item.local_path }}"
    state: directory
    owner: "{{ item.access | stortree_access_owner(stortree_user) }}"
    group: "{{ item.access | stortree_access_group(stortree_group) }}"
    mode: "{{ item.access | stortree_access_mode }}"
  loop: >-
    {{ stortree_mounts_plan
       | rejectattr('kind', 'equalto', 'transport')
       | rejectattr('transport_slug')
       | selectattr('access') | list }}
  loop_control:
    label: "{{ item.local_path }}"
  when: not (item.local_path | stortree_path_masked(stortree_masked_mount_paths))
  ignore_errors: true
  tags: [mounts]

- name: Render systemd units for every transport mount
  # Layer 1, and rendered first: every presentation below reads a path
  # inside one of these, so nothing else can start until they do.
  ansible.builtin.template:
    src: stortree-remote@.service.j2
    dest: "/etc/systemd/system/stortree-remote@{{ entry.slug }}.service"
    mode: "0644"
  loop: >-
    {{ stortree_mounts_plan | selectattr('kind', 'equalto', 'transport') | list }}
  loop_control:
    loop_var: entry
    label: "{{ entry.local_path }}"
  register: stortree_remotes_units_rendered
  notify: stortree mounts changed
  tags: [mounts]

- name: Render systemd units for every presentation mount
  # Layer 2. Ahead of the per-user bind units below: a bind's own
  # mountpoint lives inside whichever presentation composes it into
  # view, so that presentation has to be up first
  # (stortree-bind@.service.j2's own dependency on it).
  ansible.builtin.template:
    src: stortree-mount@.service.j2
    dest: "/etc/systemd/system/stortree-mount@{{ entry.slug }}.service"
    mode: "0644"
  loop: >-
    {{ stortree_mounts_plan | selectattr('kind', 'equalto', 'mount') | list }}
  loop_control:
    loop_var: entry
    label: "{{ entry.local_path }}"
  register: stortree_mounts_units_rendered
  notify: stortree mounts changed
  tags: [mounts]

- name: Render systemd units for every per-user bind mount
  ansible.builtin.template:
    src: stortree-bind@.service.j2
    dest: "/etc/systemd/system/stortree-bind@{{ entry.slug }}.service"
    mode: "0644"
  loop: >-
    {{ stortree_mounts_plan | selectattr('kind', 'equalto', 'bind') | list }}
  loop_control:
    loop_var: entry
    label: "{{ entry.local_path }}"
  register: stortree_binds_units_rendered
  notify: stortree mounts changed
  tags: [mounts]

- name: Flush handlers so newly rendered units are known to systemd before enabling
  ansible.builtin.meta: flush_handlers
  tags: [mounts]

- name: Collect every unit this apply rendered
  # The three families differ in template and unit-name prefix and in
  # nothing else that the two steps below care about: restarting a
  # changed unit and enabling/starting it are the same operation on all
  # of them, and they have to happen in the order the units were
  # rendered in (a wrapper mount before the bind mounts nesting inside
  # it -- see the render tasks above). Written once here instead of
  # three times each, and keyed off each result's own `dest`, so a
  # unit's name comes from the task that actually rendered it rather
  # than from a second expression that has to be kept saying the same
  # thing.
  ansible.builtin.set_fact:
    stortree_mounts_rendered_units: >-
      {{ stortree_mounts_units_rendered.results
         + stortree_remotes_units_rendered.results
         + stortree_binds_units_rendered.results }}
  tags: [mounts]

- name: Restart any unit whose file actually changed
  # A changed ExecStart (new rclone args, or access-driven --allow-other/
  # --uid/--gid/--dir-perms/--file-perms, spec.md §6) never takes effect
  # on an already-running unit otherwise: systemd_service: state: started
  # below is a no-op once a unit is already active, and daemon-reload
  # (the "stortree mounts changed" handler above) only makes systemd
  # aware the *file* changed, not the running process -- it keeps running
  # with whatever args it originally started with, silently stale, until
  # something restarts it. Scoped to just the units that actually
  # re-rendered, not every resolved unit, so an unrelated mount's open
  # file handles aren't disrupted on every apply.
  #
  # A replaced rclone binary is the same staleness with no changed file
  # to notice it by: the running process holds the old inode open and
  # goes on serving 1.60.1 behaviour indefinitely, so an upgraded host
  # would keep the old metrics flavour and the old bugs until something
  # unrelated happened to restart it. Hence the second clause -- but
  # only for the transports, which are the units that execute rclone at
  # all. The presentations and binds above them come back on their own
  # through PartOf=, which is also why this is genuinely disruptive and
  # why the runbook says to roll an upgrade one host at a time.
  ansible.builtin.systemd_service:
    name: "{{ item.dest | basename }}"
    state: restarted
  loop: "{{ stortree_mounts_rendered_units }}"
  loop_control:
    label: "{{ item.entry.local_path }}"
  when: >-
    item.changed
    or (stortree_rclone_upgraded
        and item.dest | basename is match('stortree-remote@'))
  tags: [mounts]

- name: Enable and start every rendered unit
  ansible.builtin.systemd_service:
    name: "{{ item.dest | basename }}"
    enabled: true
    state: started
  loop: "{{ stortree_mounts_rendered_units }}"
  loop_control:
    label: "{{ item.entry.local_path }}"
  tags: [mounts]

- name: Publish this host's metrics endpoints for the control node to collect
  # After the units are up, and describing what was actually rendered.
  # playbooks/metrics-targets.yml collects these fragments into one
  # file_sd list; see the template for why the host writes its own.
  ansible.builtin.template:
    src: metrics-targets.json.j2
    dest: "{{ stortree_metrics_fragment }}"
    owner: "{{ stortree_user }}"
    group: "{{ stortree_group }}"
    mode: "0644"
  when: stortree_metrics_enabled
  tags: [mounts]

- name: Remove the metrics fragment on a host no longer publishing any
  # Convergence, not tidiness: a stale fragment left behind would keep
  # feeding this host's old ports to Prometheus long after the endpoints
  # stopped existing, and the resulting scrape failures would look like
  # a broken mount rather than a setting someone turned off.
  ansible.builtin.file:
    path: "{{ stortree_metrics_fragment }}"
    state: absent
  when: not stortree_metrics_enabled
  tags: [mounts]

- name: Re-stat every directory this apply was supposed to create
  # The counterweight to the blanket `ignore_errors: true` on every
  # directory-creation task above (see this file's header for why those
  # can't be fatal in place). Without this, the two failure modes those
  # tasks deliberately conflate stay conflated to the end of the run: the
  # expected transient -- a path inside a mount that hadn't been
  # re-rendered yet when creation was attempted -- and a real failure
  # like a full disk, a backend rejecting the write, or a permission bug.
  # Both left the play green.
  #
  # Re-stat*ing* rather than reading back the creation tasks' own results
  # is the point: by now the render/restart step has run, so a path that
  # failed creation only because its own mount was stale has almost
  # certainly appeared in the meantime, and whatever is still missing is
  # the interesting set.
  #
  # Every visible path the tree is supposed to compose, plus every
  # transport mountpoint under the remotes root. Masked paths are
  # skipped by `when:` rather than
  # filtered out of the loop, because `stortree_path_masked` is a filter
  # and `reject()` takes a test -- the skipped results are then dropped
  # below by `selectattr('stat', 'defined')`, since a skipped item has no
  # `stat` at all. A masked ancestor is a known state with its own
  # runbook entry (docs/runbook.md "A masked mount"), not something to
  # re-report here.
  ansible.builtin.stat:
    path: >-
      {{ (stortree_remotes_root if item.kind == 'transport' else stortree_root)
         ~ '/' ~ item.local_path }}
    get_checksum: false
  loop: "{{ stortree_mounts_plan }}"
  loop_control:
    label: "{{ item.local_path }}"
  when: not (item.local_path | stortree_path_masked(stortree_masked_mount_paths))
  register: stortree_mounts_verify
  changed_when: false
  tags: [mounts]

- name: Report any directory that is still missing
  # Always runs, whatever `stortree_mounts_strict` says: the silence is
  # the bug being fixed here, so the operator sees the list either way
  # and only the *fatality* is configurable.
  ansible.builtin.debug:
    msg: >-
      {{ stortree_mounts_missing | length }} path(s) this apply should
      have created are still missing:
      {{ stortree_mounts_missing | join(', ') }}.
      A brand-new nested entry needs a second apply before its own parent
      mount exists to create it inside (expected); anything that survives
      that second apply is a real failure -- look back at the
      ignore_errors'd directory tasks in this run's output for the actual
      error. Set stortree_mounts_strict=true to make this fatal.
  vars:
    stortree_mounts_missing: >-
      {{ stortree_mounts_verify.results
         | selectattr('stat', 'defined') | rejectattr('stat.exists')
         | map(attribute='item.local_path') | list }}
  when: stortree_mounts_missing | length > 0
  tags: [mounts]

- name: Report any granted path whose ownership does not match its grant
  # Existence was never the interesting question. The bug this layering
  # exists to fix looked exactly like success: Ansible reported the chown
  # as `changed`, the path existed, and `stat` kept returning the
  # ancestor mount's own uniform owner on every apply afterwards. Nothing
  # compared the two, so nothing noticed for as long as it took someone
  # to look by hand.
  #
  # Advisory, not fatal, and deliberately so: a brand-new nested entry
  # legitimately reads wrong until the apply that mounts its presentation
  # completes, and a masked ancestor has its own runbook entry. What it
  # buys is that a grant which silently stops being applied says so.
  ansible.builtin.debug:
    msg: >-
      {{ stortree_mounts_misowned | length }} granted path(s) do not match
      their resolved grant: {{ stortree_mounts_misowned | join('; ') }}.
      Expected owner/group/mode come from the node's `access` block; a
      path that still disagrees after a second apply means its
      presentation mount is not up -- check
      `systemctl status stortree-mount@<slug>`.
  vars:
    stortree_mounts_misowned: >-
      {{ stortree_mounts_verify.results
         | selectattr('stat', 'defined') | selectattr('stat.exists')
         | selectattr('item.access')
         | rejectattr('item.kind', 'equalto', 'transport')
         | map('stortree_ownership_mismatch', stortree_user, stortree_group)
         | reject('equalto', '') | list }}
  when: stortree_mounts_misowned | length > 0
  tags: [mounts]

- name: Fail when a directory is still missing and strict mode is on
  ansible.builtin.fail:
    msg: >-
      stortree_mounts_strict is set and {{ stortree_mounts_missing | length }}
      expected path(s) are still missing after this apply:
      {{ stortree_mounts_missing | join(', ') }}
  vars:
    stortree_mounts_missing: >-
      {{ stortree_mounts_verify.results
         | selectattr('stat', 'defined') | rejectattr('stat.exists')
         | map(attribute='item.local_path') | list }}
  when:
    - stortree_mounts_strict | bool
    - stortree_mounts_missing | length > 0
  tags: [mounts]
