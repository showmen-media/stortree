---
# One rclone-mount@<slug>.service per resolved mount (server subtree,
# client mount, or peer-sourced samba descendant this host doesn't own --
# mesh-sourced directly from whichever host actually owns it, spec.md
# §1/§2), expanding user-subdirs entries into one mount per authorized
# user (spec.md §2, docs/plan.md interpretation call #2).
# Ansible's own idempotence (template only rewrites on change,
# systemd_service only touches state that's out of sync) covers what a
# hand-rolled reconciler would otherwise need to implement; only the
# "stale unit no longer in the resolved set" case needs an explicit
# cleanup step below.
#
# `rclone` never inherits down the tree (docs/config-schema.md "Node
# inheritance"), so not every entry in the flat mount plan is an actual
# rclone mount -- an entry with no `remote` is a plain directory that has
# to exist (either nested inside an ancestor's mount, or kept as real
# local storage on its resolved host) but has no rclone unit of its own;
# only entries with a `remote` get one below.
#
# Every resolved path -- mount point or plain directory alike -- gets its
# Unix owner/group/mode set from its own `access` grant (spec.md §6,
# stortree_access_owner/_group/_mode): with neither `owner` nor `group`
# granted, that's the plain default (owner stortree, full control; group
# stortree, read+traverse; other none) every path had before `access`
# existed. A remote-backed node's mount additionally omits --allow-other
# unless `access` grants an owner and/or group (rendered unconditionally
# below, from the same three filters, so the two always agree): without
# it, FUSE restricts a mount to the mounting user (stortree) and root --
# no other local process, including an SSH session from an
# LDAP-authenticated user, can reach it at all, matching what a fresh
# mount with no grant should do. With a grant, the template instead
# uid/gid-owns the mount directly (--uid/--gid, --dir-perms, --file-perms
# from the same mode) and adds --allow-other back -- real kernel-enforced
# access, checked against whoever's actually connecting (smbd included,
# which runs as the real authenticated user, not a fixed service
# account, so this is enforced for Samba the same way it is for direct
# SSH). This is exactly what `access` can express and no more -- one
# owner, one group, one shared permissions level -- because that's all a
# remote-backed node can ever actually carry (rclone's FUSE mount has no
# POSIX ACL support at all), and the schema doesn't let you write
# anything broader than that (_normalize_access() rejects a list).

- name: Install rclone and fuse
  ansible.builtin.apt:
    name:
      - rclone
      - fuse
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [mounts]

- name: Compute this host's flat mount plan
  # stortree_group_members (resolved by stortree_secrets, which always
  # runs before this role -- site.yml §8) covers every group referenced
  # in a per-user access grant, whether this host owns the node
  # (server_subtrees) or peer-sources it (peer_dependencies) -- both get
  # %U-expanded here into one mount per actual user.
  ansible.builtin.set_fact:
    stortree_mounts_plan: "{{ stortree | stortree_plan_mounts(stortree_group_members) }}"
  tags: [mounts]

- name: Ensure every resolved path exists (mount points and plain directories alike)
  # Ownership/mode come from the path's own `access` grant, not a fixed
  # default -- see this file's header comment. Harmless to set on a
  # remote-backed entry's mountpoint too: once mounted, the mount's own
  # reported permissions (rendered into the unit below, from the same
  # three filters) are all that's actually visible there.
  ansible.builtin.file:
    path: "{{ (stortree_root ~ '/' ~ item.local_path) if item.local_path else stortree_root }}"
    state: directory
    owner: "{{ item.access | stortree_access_owner(stortree_user) }}"
    group: "{{ item.access | stortree_access_group(stortree_group) }}"
    mode: "{{ item.access | stortree_access_mode }}"
  loop: "{{ stortree_mounts_plan }}"
  loop_control:
    label: "{{ item.local_path or '(root)' }}"
  tags: [mounts]

- name: Render systemd units for every resolved mount
  ansible.builtin.template:
    src: stortree-mount@.service.j2
    dest: "/etc/systemd/system/stortree-mount@{{ entry.slug }}.service"
    mode: "0644"
  loop: "{{ stortree_mounts_plan | selectattr('remote') | list }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.local_path or '(root)' }}"
  notify: stortree mounts changed
  tags: [mounts]

- name: Flush handlers so newly rendered units are known to systemd before enabling
  ansible.builtin.meta: flush_handlers
  tags: [mounts]

- name: Enable and start every resolved mount
  ansible.builtin.systemd_service:
    name: "stortree-mount@{{ item.slug }}.service"
    enabled: true
    state: started
  loop: "{{ stortree_mounts_plan | selectattr('remote') | list }}"
  loop_control:
    label: "{{ item.local_path or '(root)' }}"
  tags: [mounts]

- name: Find currently installed stortree mount units
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "stortree-mount@*.service"
  register: stortree_mounts_installed_units
  tags: [mounts]

- name: Determine stale units no longer in the resolved set
  ansible.builtin.set_fact:
    stortree_mounts_stale_units: >-
      {{ stortree_mounts_installed_units.files
         | map(attribute='path')
         | map('basename')
         | reject('in', stortree_mounts_plan | stortree_mount_unit_names)
         | list }}
  tags: [mounts]

- name: Stop and disable stale mount units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ stortree_mounts_stale_units }}"
  tags: [mounts]

- name: Remove stale mount unit files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop: "{{ stortree_mounts_stale_units }}"
  notify: stortree mounts changed
  tags: [mounts]
