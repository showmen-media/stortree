---
# One rclone-mount@<slug>.service per resolved mount (server subtree,
# client mount, or peer-sourced samba descendant this host doesn't own --
# mesh-sourced directly from whichever host actually owns it, spec.md
# §1/§2), resolving a user-subdirs entry's %U-templated path against its
# own `access` grant (spec.md §2, docs/plan.md interpretation call #2):
# an `owner` grant still gets one real mount at that one user's own path;
# a `group`-only grant instead gets exactly one real, shared mount (at
# `stortree_plan_mounts`' hidden `.mounts` path for that node) plus one
# bind mount per member fanning it back out to each member's own folder
# (a real symlink can't do this job when the member's own folder lives on
# a remote-backed node itself -- see the per-user bind-mount tasks below
# for why) -- see `per_user_mount_path()` in filter_plugins/stortree.py
# for why one mount now serves every member instead of one full duplicate each
# (N members used to mean N redundant rclone procs/VFS caches of
# identical content, with no cache coherency between them, even though
# the access grant behind every one of those duplicates was always the
# same single group).
# Ansible's own idempotence (template only rewrites on change,
# systemd_service only touches state that's out of sync) covers most of
# what a hand-rolled reconciler would otherwise need to implement -- but
# not quite all of it: `systemd_service: state: started` is a no-op for
# a unit that's already active, so a changed ExecStart alone never
# reaches an already-running mount without an explicit restart (below);
# and a "stale unit no longer in the resolved set" needs an explicit
# cleanup step too -- run *before* path creation below, not after: a
# node that used to be a real per-user mount (before this host had any
# `.mounts`-collapsed group grant, or before a member left a group) and
# is now instead the destination of a per-user bind mount has to have
# its old per-user unit stopped and unmounted first, or that still-busy
# mountpoint directory ends up bind-mounted on top of yet another live
# mount instead of the plain, empty directory a bind mount needs to
# start from.
#
# Every directory-creation task below is `ignore_errors: true`
# for exactly this reason too, not just to route around a masked
# ancestor: a path nested under a mount whose *own* config just changed
# (a corrected `rclone.remote`, say) can't be created until that mount
# is actually re-rendered and restarted with the fix -- which happens
# further down this same file. Ansible aborts the whole play for a host
# on a task's first unhandled failure, so a real, non-masked failure
# here (not just a skip) would permanently block this file from ever
# reaching the render/restart step that would fix the *actual* problem
# -- a stale mount stopping its own fix from ever being applied, forever
# repeating the identical failure on every subsequent run regardless of
# how many times the underlying config gets corrected (production hit
# exactly this: a top-level subtree's `rclone.remote` got fixed twice in
# a row, and the live unit never picked up either fix, because a nested
# entry's directory creation kept failing first and aborting the play
# before render/restart ever ran). Letting these fail non-fatally costs
# nothing more than one extra apply -- the same "two-run" pattern this
# design already has for a brand-new nested entry generally (its own
# parent mount has to exist and be reachable before anything can be
# created inside it, same as always).
#
# `rclone` never inherits down the tree (docs/config-schema.md "Node
# inheritance"), so not every entry in the flat mount plan is an actual
# rclone mount -- an entry with no `remote` is either a plain directory
# that has to exist (either nested inside an ancestor's mount, or kept as
# real local storage on its resolved host) or a per-user bind mount
# fanning a `group`-only node's one shared mount back out to a member's
# own folder (`symlink_target` set -- the field name predates the switch
# from a real symlink to a bind mount, see filter_plugins/stortree.py's
# plan_mounts() docstring for why) -- neither has an rclone unit of its
# own; only entries with a `remote` get one below, and only entries with
# a `symlink_target` get a stortree-bind@ unit further down.
#
# Every plain directory (no `remote`) gets its Unix owner/group/mode set
# from its own `access` grant (spec.md §6, stortree_access_owner/_group/
# _mode): with neither `owner` nor `group` granted, that's the plain
# default (owner stortree, full control; group stortree, read+traverse;
# other execute-only) every path had before `access` existed, plus a
# public-execute traversal bit (access_mode() in filter_plugins/
# stortree.py) -- without it, an ordinary LDAP-authenticated user (never
# a member of the local `stortree` group) can't even `chdir()` through
# this ancestor to reach a real grant nested underneath it, no matter how
# permissive that grant itself is: every directory component on the path
# needs its own execute bit, and Samba/SSH access both run as that real
# user post-privilege-drop, subject to the same kernel checks as anyone
# else. A remote-backed node's own mountpoint directory does NOT follow
# `access` this way -- it stays stortree:stortree 0751 no matter what's
# granted, since the grant is enforced by the mount that covers it
# instead (see below), and the account that actually performs that mount
# is unconditionally `stortree` (User= in the unit template), never the
# grant's own `owner`; chowning the pre-mount directory to a granted
# `owner` leaves `stortree` with no bits on it at all, and `fusermount`
# refuses to mount there ("Permission denied") before the grant it was
# chasing ever becomes visible. A per-user bind-mount entry carries no
# `access` of its own either (it's enforced once, at the real mount
# `symlink_target` points to, exactly as a symlink's target enforcement
# would have been) -- but unlike a symlink, its own mountpoint directory
# is a real, separate inode that has to be creatable and traversable in
# its own right before anything can be bound onto it, so it still gets
# the same plain stortree:stortree 0751 default as any other unmodeled
# container path (no `access`-driven chown/chmod needed -- what's
# actually visible once mounted is entirely the bound-in target's own
# enforcement, unaffected by this directory's own ownership once
# something's mounted over it). A
# remote-backed node's mount additionally omits --allow-other unless
# `access` grants an owner and/or group (rendered unconditionally below,
# from the same three filters, so the two always agree): with neither
# granted, FUSE restricts a mount to the mounting user (stortree) alone
# -- no other local process, including root, an SSH session from an
# LDAP-authenticated user, or Ansible itself on a later apply, can reach
# it at all. That "including root" is not a theoretical edge case here:
# rclone's own `--allow-root` (the documented way to widen a private
# mount to "mounting user and root", the same relationship a plain local
# directory's default owner/group already gives root implicitly) is
# silently ignored by the rclone build this fleet runs ("Ignoring
# --allow-root. Support has been removed upstream", rclone logs this on
# every mount attempt) -- there is no flag this file can render that
# gets root into an ungranted mount, ever, and every task below that
# touches an already-resolved path has to assume that going in: probe
# whether root can actually reach a remote-backed entry's own
# mountpoint before touching it (below -- a direct `stat`, not
# `ansible_facts.mounts`, which silently drops some of this fleet's own
# mounts from its list regardless of how reachable they are, see the
# probe task's own comment) rather than let a live one's own
# EEXIST/permission errors surface as a task failure the way they used
# to. With a grant,
# the template instead uid/gid-owns the mount directly (--uid/--gid,
# --dir-perms, --file-perms from the same mode) and adds --allow-other
# back -- real kernel-enforced access, checked against whoever's
# actually connecting (smbd included, which runs as the real
# authenticated user, not a fixed service account, so this is enforced
# for Samba the same way it is for direct SSH). This is exactly what
# `access` can express and no more -- one owner, one group, one shared
# permissions level -- because that's all a remote-backed node can ever
# actually carry (rclone's FUSE mount has no POSIX ACL support at all),
# and the schema doesn't let you write anything broader than that
# (_normalize_access() rejects a list).

- name: Install rclone and fuse
  ansible.builtin.apt:
    name:
      - rclone
      - fuse
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [mounts]

- name: Allow FUSE mounts to grant access beyond the mounting user
  # A precondition for --allow-other (a granted mount, `access`
  # owner/group, rendered below) -- libfuse's own fusermount refuses the
  # option outright ("fusermount: option allow_other only allowed if
  # 'user_allow_other' is set in /etc/fuse.conf") from a non-root
  # mounting process (stortree, always -- User= in the unit template)
  # without this. Ahead of every other task below -- an already-running
  # mount that needed it would otherwise have started without it (rclone
  # doesn't retry a rejected mount option, it just fails outright,
  # spec.md's "Enable and start every resolved mount" task's own failure
  # mode) before this file ever got the chance to fix that up. Doesn't
  # help an *ungranted* mount reach any wider than the mounting user
  # itself -- see this file's header comment for why --allow-root can't
  # do for that mount what this does for a granted one's --allow-other.
  ansible.builtin.lineinfile:
    path: /etc/fuse.conf
    regexp: '^#?\s*user_allow_other\s*$'
    line: user_allow_other
    create: true
    owner: root
    group: root
    mode: "0644"
  tags: [mounts]

- name: Compute this host's flat mount plan
  # stortree_group_members (resolved by stortree_secrets, which always
  # runs before this role -- site.yml §8) covers every group referenced
  # in a per-user access grant, whether this host owns the node
  # (server_subtrees) or peer-sources it (peer_dependencies) -- both get
  # %U-resolved here into either one real mount per authorized user
  # (an `owner` grant) or one shared mount plus one bind mount per member
  # (a `group`-only grant).
  ansible.builtin.set_fact:
    stortree_mounts_plan: "{{ stortree | stortree_plan_mounts(stortree_group_members) }}"
  tags: [mounts]

- name: Compute this host's per-user container ownership
  # One entry per real <user-subdirs-prefix>/<username> folder any of
  # this host's resolved access grants (server_subtrees or
  # peer_dependencies) needs -- see user_container_paths() in
  # filter_plugins/stortree.py for why this can't just be read off
  # stortree_mounts_plan's own entries (that per-user container path
  # never appears there as an entry of its own, only implied as an
  # ancestor of one). stortree_mounts_plan (just computed above) is what
  # lets it tell apart the two ways a container can get real ownership:
  # `requires_slug` set means the container nests inside a remote-backed
  # mount and needs a wrapper mount of its own (plain chown can't work
  # there -- see user_container_paths()'s own docstring); unset means a
  # plain local container, chowned directly, no wrapper needed.
  ansible.builtin.set_fact:
    stortree_user_containers: "{{ stortree | stortree_user_containers(stortree_group_members, stortree_mounts_plan) }}"
  tags: [mounts]

- name: Note which mounts have another mount nested inside them
  # A mount that something else nests inside (`requires_slug` pointing
  # back at it) needs consistent, predictable stortree:stortree ownership
  # regardless of its own `access` grant -- every nested mount always
  # runs as User=stortree (the unit template, unconditionally), so
  # fusermount's own same-owner check for a *new* mount only ever
  # succeeds against a parent path it can see itself owning. An
  # *ungranted* parent has no such guarantee: its reported ownership,
  # once actually mounted, is whatever its own remote backend happens to
  # report (a third-party storage box's own arbitrary account, or -- for
  # a peer-sftp mount -- the numeric uid the owning host's `stortree`
  # account happens to have been allocated, never guaranteed to match
  # this host's own) -- neither is reliably `stortree` from this host's
  # point of view, and fusermount refuses ("bad mount point ...
  # Permission denied") the moment it isn't. The template forces
  # --uid/--gid/--allow-other for exactly the mounts in this set, on top
  # of (never instead of) whatever their own `access` grant already adds.
  ansible.builtin.set_fact:
    stortree_mounts_parent_slugs: >-
      {{ stortree_mounts_plan
         | selectattr('requires_slug')
         | map(attribute='requires_slug')
         | unique
         | list }}
  tags: [mounts]

- name: Find currently installed stortree mount units
  # Run before any path is touched below (see this file's header comment)
  # -- a path that's switching roles between runs (real per-user mount ->
  # bind-mount destination, most notably) needs its old unit stopped and
  # unmounted *before* stortree_mounts_plan's new shape is applied to
  # disk, not after.
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns:
      - "stortree-mount@*.service"
      - "stortree-bind@*.service"
      - "stortree-user-mount@*.service"
  register: stortree_mounts_installed_units
  tags: [mounts]

- name: Determine stale units no longer in the resolved set
  ansible.builtin.set_fact:
    stortree_mounts_stale_units: >-
      {{ stortree_mounts_installed_units.files
         | map(attribute='path')
         | map('basename')
         | reject('in', (stortree_mounts_plan | stortree_mount_unit_names)
                         + (stortree_user_containers | stortree_user_mount_unit_names))
         | list }}
  tags: [mounts]

- name: Stop and disable stale mount units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ stortree_mounts_stale_units }}"
  tags: [mounts]

- name: Remove stale mount unit files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop: "{{ stortree_mounts_stale_units }}"
  notify: stortree mounts changed
  tags: [mounts]

- name: Flush handlers so stale-unit removal is known to systemd before path creation
  ansible.builtin.meta: flush_handlers
  tags: [mounts]

- name: Clear failed-state bookkeeping for any stortree unit no longer backed by a file
  # `systemctl list-units --all` (what playbooks/status.yml reports) keeps
  # a unit's own last-known failed state around -- exactly the "not-found
  # failed failed" rows that command surfaces -- even after "Remove stale
  # mount unit files" above and its daemon-reload handler have made the
  # unit's *load* state `not-found`: daemon-reload only clears that load
  # state, not the separate failed-state bookkeeping, which needs its own
  # explicit reset. Scoped to every current *and historical*
  # stortree-mount@/stortree-bind@ slug, not just `stortree_mounts_stale_
  # units` above -- a unit whose file was already removed by an earlier
  # apply (before this task existed, or from an earlier schema/naming
  # iteration -- e.g. a bare `home/...` slug from before top-level
  # subtrees existed) never shows up in that set at all, since there's no
  # file left for "Find currently installed stortree mount units" to find.
  # Unconditional and idempotent every single apply: resetting a unit
  # that isn't actually in a failed state is a documented no-op, so this
  # costs nothing on a clean run and self-heals any accumulated ghost
  # state from any past slug family, not just whatever changed today.
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: >-
      systemctl reset-failed 'stortree-mount@*.service' 'stortree-bind@*.service'
      'stortree-user-mount@*.service'
  changed_when: false
  tags: [mounts]

- name: Probe whether each remote-backed entry's own mountpoint is reachable
  # `ansible_facts.mounts` can't be trusted for this -- Ansible's own
  # mount-fact gathering silently drops any mount whose reported device
  # string doesn't start with "/" and doesn't contain ":/"
  # (module_utils/facts/hardware/linux.py get_mount_facts(), a filter
  # meant to skip pseudo-filesystems like proc/tmpfs that report
  # non-path "device" names). rclone's own FUSE mounts report a bare
  # "remote:path" device string, and whether that string happens to
  # contain ":/" depends entirely on whether the remote path itself
  # starts with a "/" -- `some-remote:/.stortree-cache` mounts
  # with the reported device `some-remote:.stortree-cache` (no
  # "/" survives after the colon), which this fleet hit in production:
  # a live, healthy, currently-running mount, silently absent from
  # `ansible_facts.mounts` regardless, making any check built on that
  # fact unreliable for at least this remote and any other whose device
  # string happens to land the same way.
  #
  # A direct `stat` answers the actual question instead -- can Ansible
  # manage this path right now -- without caring how the mount reports
  # its own device string: it fails (`ignore_errors` below is what lets
  # that become a signal instead of aborting the run) exactly when a
  # mount sits there that this host's root can't reach (an ungranted
  # mount, this file's header comment; `ansible.builtin.stat`'s own
  # source only treats ENOENT specially -- anything else, permission
  # denied included, surfaces as the task failing outright), while
  # succeeding cleanly (`stat.exists: false`) for a path nothing's ever
  # mounted at yet, so a first-time mount still gets its directory
  # created normally below.
  ansible.builtin.stat:
    path: "{{ (stortree_root ~ '/' ~ item.local_path) if item.local_path else stortree_root }}"
  loop: "{{ stortree_mounts_plan | selectattr('remote') | list }}"
  loop_control:
    label: "{{ item.local_path or '(root)' }}"
  register: stortree_mount_point_probe
  ignore_errors: true
  tags: [mounts]

- name: Note which resolved mount points are already active but unreachable
  ansible.builtin.set_fact:
    stortree_masked_mount_paths: >-
      {{ stortree_mount_point_probe.results
         | selectattr('failed')
         | map(attribute='item.local_path')
         | list }}
  tags: [mounts]

- name: Note which resolved mount points are already active and reachable
  # A live mount's own directory needs nothing further from this file --
  # it already exists, correctly owned, or it couldn't have mounted in
  # the first place. Its *parent* is exactly what the next task would
  # otherwise re-touch on every single apply from here on, and doing
  # that once something's actually mounted several levels beneath it
  # (a nested remote-backed entry, e.g. a peer-sourced samba descendant
  # under a top-level subtree) has turned out to be unsafe against at
  # least one backend in production: an SMB share choked with a bare
  # I/O error re-stat'ing a plain directory that had a live, unrelated
  # FUSE mount sitting inside it -- a working config that had applied
  # clean once broke on every subsequent run purely from touching that
  # parent again, nothing about the resolved plan having changed at
  # all. Skip ever revisiting an already-mounted entry's own parent
  # (next task) -- it was necessarily created and correctly owned
  # whenever the mount itself first came up; nothing about a `remote`
  # entry's own parent ownership is meant to change afterward anyway
  # (always stortree:stortree 0751, this file's header comment).
  ansible.builtin.set_fact:
    stortree_mounts_already_mounted_paths: >-
      {{ stortree_mount_point_probe.results
         | rejectattr('failed')
         | selectattr('stat.exists')
         | map(attribute='item.local_path')
         | list }}
  tags: [mounts]

- name: Ensure every mount point's parent directory exists
  # A `group`-only grant's real, shared mount resolves its %U-templated
  # path through SHARED_MOUNT_SEGMENT (".mounts", per_user_mount_path())
  # -- a path segment with no tree node of its own, unlike every real
  # ancestor (e.g. "home"), which gets its own explicit entry in
  # stortree_mounts_plan and is handled by the plain-directory/mount-
  # point task below in the very same loop. Nothing else in this file
  # ever creates ".mounts" explicitly, so it's left to Ansible's own
  # implicit parent creation when the mount task below creates the
  # deeper leaf path -- which, unlike the leaf itself, does NOT get the
  # `owner`/`group`/`mode` given to that task; it inherits root's umask
  # instead. Restrictive enough on some hosts to lock `stortree` (the
  # account that actually performs the mount, see the mount-point task's
  # own comment) out of a directory it needs to enter just to reach the
  # leaf beneath it -- the same "fusermount: bad mount point ...
  # Permission denied" failure as an over-restrictive leaf, just one
  # level up. Explicit and ahead of the mount-point task below so this is
  # never left to implicit creation; harmless where the parent's really
  # an ordinary ancestor node too, since that node's own explicit entry
  # (processed in the very same apply) corrects anything this leaves too
  # permissive, exactly as it already did before this task existed.
  #
  # Skipped entirely once the entry itself is already actively mounted
  # (`stortree_mounts_already_mounted_paths`, set above) -- see that
  # task's own comment for why re-touching an already-mounted entry's
  # parent, every single apply from here on, isn't safe to keep doing.
  ansible.builtin.file:
    path: "{{ stortree_root ~ '/' ~ (item.local_path | dirname) }}"
    state: directory
    owner: "{{ stortree_user }}"
    group: "{{ stortree_group }}"
    mode: "0751"
  loop: "{{ stortree_mounts_plan | selectattr('remote') | list }}"
  loop_control:
    label: "{{ item.local_path }}"
  when:
    - (item.local_path | dirname) != ''
    - not ((item.local_path | dirname) | stortree_path_masked(stortree_masked_mount_paths))
    - item.local_path not in stortree_mounts_already_mounted_paths
  ignore_errors: true
  tags: [mounts]

- name: Ensure every resolved mount point or plain directory exists
  # Ownership/mode come from the path's own `access` grant, not a fixed
  # default -- see this file's header comment -- *except* for a
  # remote-backed entry's own mountpoint, which stays stortree:stortree
  # 0751 regardless of its `access` grant. That pre-mount directory is
  # never what an `access` grant is actually describing (the unit below
  # already renders the same grant into rclone's --uid/--gid/--dir-perms/
  # --file-perms, which is what's actually visible once mounted) -- it
  # only has to be usable by whichever account performs the mount, which
  # is unconditionally `stortree` (User= in the unit template, never the
  # grant's own `owner`). An `owner`-granted mount chowns this directory
  # to the granted user with mode 0700 if it follows `access` like a
  # plain directory would: stortree then has no bits on it at all (not
  # the owner, and the granted owner's directory carries no stortree
  # group/other access), so `fusermount` refuses with "Permission
  # denied" before rclone ever gets to establish the mount that would've
  # made the grant visible in the first place.
  #
  # Any entry -- remote-backed or a plain directory alike -- additionally
  # skips outright once its own path is itself masked, or nested
  # underneath a masked ancestor (`stortree_path_masked()`, checked
  # against `stortree_masked_mount_paths`): an already-running,
  # unreachable mount has nothing left for this task to verify or
  # correct for its own path (an ungranted mount is unreachable to root
  # permanently, this file's header comment), and root can't create
  # anything nested inside it either -- attempting either used to fail
  # outright (a masked entry's own path with "Permission denied", or a
  # path nested underneath one with "File exists", Ansible's recursive
  # parent-creation colliding with the very directory it can't see
  # inside) instead of cleanly doing nothing until the masked ancestor
  # itself is dealt with -- normally by the unit render/restart below
  # this same run, which gives the ancestor --allow-other so it stops
  # being masked at all (docs/runbook.md "A masked mount").
  ansible.builtin.file:
    path: "{{ (stortree_root ~ '/' ~ item.local_path) if item.local_path else stortree_root }}"
    state: directory
    owner: "{{ stortree_user if item.remote else (item.access | stortree_access_owner(stortree_user)) }}"
    group: "{{ stortree_group if item.remote else (item.access | stortree_access_group(stortree_group)) }}"
    mode: "{{ '0751' if item.remote else (item.access | stortree_access_mode) }}"
  loop: "{{ stortree_mounts_plan | rejectattr('symlink_target') | list }}"
  loop_control:
    label: "{{ item.local_path or '(root)' }}"
  when: not (item.local_path | stortree_path_masked(stortree_masked_mount_paths))
  ignore_errors: true
  tags: [mounts]

- name: Ensure every per-user bind mountpoint's parent directory exists
  # A `group`-only grant with no sibling owner-only leaf under the same
  # `home/<user>` folder (e.g. mw-fam with no sys-configs alongside it)
  # produces *only* a bind-mount entry for that user -- no plain-directory
  # or mount entry ever resolves to `home/<user>` itself, so nothing
  # above would otherwise create it. Explicit and ahead of the bind-
  # mountpoint task below, same reason as "Ensure every mount point's
  # parent directory exists" above: don't rely on implicit multi-level
  # directory creation against a backend (this file's already hit one in
  # production) that doesn't reliably support creating more than one
  # missing path level in a single step. No `access` of its own to set
  # ownership/mode from -- it isn't a node in the tree, just an implied
  # container -- so it gets the same plain default every unmodeled path
  # got before `access` existed.
  ansible.builtin.file:
    path: "{{ stortree_root ~ '/' ~ (item.local_path | dirname) }}"
    state: directory
    owner: "{{ stortree_user }}"
    group: "{{ stortree_group }}"
    mode: "0751"
  loop: "{{ stortree_mounts_plan | selectattr('symlink_target') | list }}"
  loop_control:
    label: "{{ item.local_path | dirname }}"
  when: not ((item.local_path | dirname) | stortree_path_masked(stortree_masked_mount_paths))
  ignore_errors: true
  tags: [mounts]

- name: Ensure every per-user bind mountpoint directory exists
  # Fans a `group`-only node's one real, shared mount back out to each
  # authorized member's own folder via a kernel bind mount, not a real
  # symlink (stortree_plan_mounts' symlink_target field, still named for
  # the mechanism this replaced -- see plan_mounts()'s own docstring): a
  # symlink is a directory entry the *target* directory's own backend has
  # to be able to represent, and not every remote backend can (an SMB
  # share, in production, flatly refused with an I/O error trying to
  # create one at all). A bind mount needs an ordinary, empty directory
  # to mount onto instead -- exactly what every other mountpoint in this
  # file already gets (the "Ensure every resolved mount point or plain
  # directory exists" task above, which this mirrors), stortree:stortree
  # 0751 same as any other unmodeled path (no `access` of its own -- it
  # isn't a node in the tree, just an implied container whose real
  # enforcement lives on the mount it's about to be bound onto). The
  # actual bind mount itself happens via the stortree-bind@ unit rendered
  # below, not here -- this task only has to get an empty directory in
  # place for that unit's ExecStart to mount onto.
  ansible.builtin.file:
    path: "{{ stortree_root ~ '/' ~ item.local_path }}"
    state: directory
    owner: "{{ stortree_user }}"
    group: "{{ stortree_group }}"
    mode: "0751"
  loop: "{{ stortree_mounts_plan | selectattr('symlink_target') | list }}"
  loop_control:
    label: "{{ item.local_path }}"
  when: not (item.local_path | stortree_path_masked(stortree_masked_mount_paths))
  ignore_errors: true
  tags: [mounts]

- name: Own every plain-local per-user container by the one real user it's for
  # Every task above that touches a per-user container path (the two
  # "...parent directory exists" tasks, and Ansible's own implicit
  # parent creation inside "Ensure every resolved mount point or plain
  # directory exists") only ever sets it to the plain stortree:stortree
  # default -- correct for an ordinary unmodeled ancestor, but a
  # user-subdirs container is never just that: it's the one real folder
  # a specific person's descendant grants (owner or group) actually live
  # under, and access_mode()'s public-execute bit on the stortree:stortree
  # default only makes it *traversable*, not owned by that person -- no
  # different from anyone else's home directory being merely
  # world-executable rather than actually theirs. This task runs last so
  # it always overrides whichever of the above most recently touched that
  # exact path, same idempotent last-word pattern as every other
  # ownership task in this file. 0750, not 0751: this directory is now
  # privately owned by that one real user, so (unlike the plain
  # stortree:stortree default) nobody else ever needs to traverse through
  # it -- only its owner and the administering `stortree` group.
  #
  # Scoped to `rejectattr('requires_slug')`: a container with
  # requires_slug set nests inside a remote-backed mount, where a plain
  # chown()/chmod() through that mount's own FUSE layer has nowhere real
  # to persist a different owner for just this one path -- confirmed
  # against a live deployment, where Ansible reported this exact task as
  # `changed` while the container's real, on-disk owner never actually
  # moved off stortree:stortree. Those containers get a wrapper mount
  # instead (below), which can actually enforce a per-path override; only
  # a genuinely plain-local container (no remote-backed ancestor at all)
  # can be chowned this simply and have it stick.
  ansible.builtin.file:
    path: "{{ stortree_root ~ '/' ~ item.local_path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ stortree_group }}"
    mode: "0750"
  loop: "{{ stortree_user_containers | rejectattr('requires_slug') | list }}"
  loop_control:
    label: "{{ item.local_path }}"
  when: not (item.local_path | stortree_path_masked(stortree_masked_mount_paths))
  ignore_errors: true
  tags: [mounts]

- name: Ensure every per-user personal-mount staging directory exists
  # The real content a wrapper mount (rendered below) re-presents with
  # its one owner's correct --uid/--gid/--dir-perms: ordinary content,
  # inside the very same remote-backed mount the container itself nests
  # under, that nothing but the `stortree` account (driving both that
  # outer mount and the wrapper mount) ever touches directly -- so its
  # own ownership/mode here doesn't matter beyond being usable by
  # `stortree`, same reasoning as any other pre-mount directory in this
  # file. A sibling of the container itself (STORTREE_USER_PREFIX in
  # filter_plugins/stortree.py), so it always resolves under the same
  # already-existing parent (e.g. `home`) the container itself does.
  ansible.builtin.file:
    path: "{{ stortree_root ~ '/' ~ item.staging_path }}"
    state: directory
    owner: "{{ stortree_user }}"
    group: "{{ stortree_group }}"
    mode: "0751"
  loop: "{{ stortree_user_containers | selectattr('requires_slug') | list }}"
  loop_control:
    label: "{{ item.staging_path }}"
  when: not (item.staging_path | stortree_path_masked(stortree_masked_mount_paths))
  ignore_errors: true
  tags: [mounts]

- name: Render systemd units for every resolved mount
  ansible.builtin.template:
    src: stortree-mount@.service.j2
    dest: "/etc/systemd/system/stortree-mount@{{ entry.slug }}.service"
    mode: "0644"
  loop: "{{ stortree_mounts_plan | selectattr('remote') | list }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.local_path or '(root)' }}"
  register: stortree_mounts_units_rendered
  notify: stortree mounts changed
  tags: [mounts]

- name: Render systemd units for every per-user personal mount
  # Only containers with requires_slug set get one -- see
  # user_container_paths()/this file's "Own every plain-local per-user
  # container..." task above for the other case. Rendered and enabled
  # ahead of the per-user bind-mount units below: a descendant nested
  # under one of these containers (e.g. mw-fam) now nests *inside* this
  # wrapper mount's own presented tree, not directly inside the outer
  # remote-backed mount, so its own bind-mount unit depends on this one
  # being up first (stortree-bind@.service.j2's own preference for a
  # matching wrapper mount over its plain requires_slug).
  ansible.builtin.template:
    src: stortree-user-mount@.service.j2
    dest: "/etc/systemd/system/stortree-user-mount@{{ entry.slug }}.service"
    mode: "0644"
  loop: "{{ stortree_user_containers | selectattr('requires_slug') | list }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.local_path }}"
  register: stortree_user_mounts_units_rendered
  notify: stortree mounts changed
  tags: [mounts]

- name: Render systemd units for every per-user bind mount
  ansible.builtin.template:
    src: stortree-bind@.service.j2
    dest: "/etc/systemd/system/stortree-bind@{{ entry.slug }}.service"
    mode: "0644"
  loop: "{{ stortree_mounts_plan | selectattr('symlink_target') | list }}"
  loop_control:
    loop_var: entry
    label: "{{ entry.local_path }}"
  register: stortree_binds_units_rendered
  notify: stortree mounts changed
  tags: [mounts]

- name: Flush handlers so newly rendered units are known to systemd before enabling
  ansible.builtin.meta: flush_handlers
  tags: [mounts]

- name: Restart any mount whose unit file actually changed
  # A changed ExecStart (new rclone args, or access-driven --allow-other/
  # --uid/--gid/--dir-perms/--file-perms, spec.md §6) never takes effect
  # on an already-running unit otherwise: systemd_service: state: started
  # below is a no-op once a unit is already active, and daemon-reload
  # (the "stortree mounts changed" handler above) only makes systemd
  # aware the *file* changed, not the running process -- it keeps running
  # with whatever args it originally started with, silently stale, until
  # something restarts it. Scoped to just the units that actually
  # re-rendered (register above), not every resolved mount, so an
  # unrelated mount's open file handles aren't disrupted on every apply.
  ansible.builtin.systemd_service:
    name: "stortree-mount@{{ item.entry.slug }}.service"
    state: restarted
  loop: "{{ stortree_mounts_units_rendered.results }}"
  loop_control:
    label: "{{ item.entry.local_path or '(root)' }}"
  when: item.changed
  tags: [mounts]

- name: Restart any personal mount whose unit file actually changed
  ansible.builtin.systemd_service:
    name: "stortree-user-mount@{{ item.entry.slug }}.service"
    state: restarted
  loop: "{{ stortree_user_mounts_units_rendered.results }}"
  loop_control:
    label: "{{ item.entry.local_path }}"
  when: item.changed
  tags: [mounts]

- name: Restart any bind mount whose unit file actually changed
  ansible.builtin.systemd_service:
    name: "stortree-bind@{{ item.entry.slug }}.service"
    state: restarted
  loop: "{{ stortree_binds_units_rendered.results }}"
  loop_control:
    label: "{{ item.entry.local_path }}"
  when: item.changed
  tags: [mounts]

- name: Enable and start every resolved mount
  ansible.builtin.systemd_service:
    name: "stortree-mount@{{ item.slug }}.service"
    enabled: true
    state: started
  loop: "{{ stortree_mounts_plan | selectattr('remote') | list }}"
  loop_control:
    label: "{{ item.local_path or '(root)' }}"
  tags: [mounts]

- name: Enable and start every per-user personal mount
  ansible.builtin.systemd_service:
    name: "stortree-user-mount@{{ item.slug }}.service"
    enabled: true
    state: started
  loop: "{{ stortree_user_containers | selectattr('requires_slug') | list }}"
  loop_control:
    label: "{{ item.local_path }}"
  tags: [mounts]

- name: Enable and start every per-user bind mount
  ansible.builtin.systemd_service:
    name: "stortree-bind@{{ item.slug }}.service"
    enabled: true
    state: started
  loop: "{{ stortree_mounts_plan | selectattr('symlink_target') | list }}"
  loop_control:
    label: "{{ item.local_path }}"
  tags: [mounts]
