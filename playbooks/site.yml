---
# The only entrypoint that changes state (spec.md §8). Idempotent --
# re-running converges to the same end state rather than accumulating
# drift.
#
# Usage:
#   ansible-playbook playbooks/site.yml                          # whole tree
#   ansible-playbook playbooks/site.yml --limit storage-node-x    # one host
#   ansible-playbook playbooks/site.yml --tags acl                # one concern
#   ansible-playbook playbooks/site.yml --check --diff            # dry run
#
# See docs/runbook.md for the full operator command reference.

- name: Apply the resolved stortree
  hosts: all
  become: true
  roles:
    - stortree_facts
    - stortree_common
    - stortree_identity
    - stortree_peer_trust
    - stortree_secrets
    - stortree_mounts
    - stortree_acl
    - stortree_samba
    - stortree_pam_smbpass
    - stortree_sshd
