# Minimal tree exercising a mutual peer dependency: host-a and host-b
# each own one piece of the same samba-shared node that the other needs.
# `shared` is a top-level subtree (this file's only one) -- its own key
# names /srv/stortree/shared directly, no wrapping `subdirs:` needed at
# this level.
shared:
  host: host-a
  samba:
    subpath: ""
  subdirs:
    piece-a:
      host: host-a
      rclone.remote: "remote-a:/piece-a"
    piece-b:
      host: host-b
      rclone.remote: "remote-b:/piece-b"
