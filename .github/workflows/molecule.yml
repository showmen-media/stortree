---
# The full-tree Molecule scenario, on manual dispatch only.
#
# This is the one thing docs/plan.md "What's verified" lists as never
# having been run: three privileged systemd-in-Docker containers plus
# mocked LDAP/sftp ones, exercising real rclone mounts, Samba, SSSD and
# cross-host peer trust. It's slow and, as of writing, unproven -- so
# it's kept out of the push/PR path in ci.yml until someone has watched
# it go green at least once. Promote it into ci.yml once it has.
#
# Run it from the Actions tab, or: gh workflow run molecule.yml

name: Molecule (full-tree)

"on":
  workflow_dispatch:
    inputs:
      scenario:
        description: Molecule scenario directory under molecule/
        required: false
        default: full-tree

permissions:
  contents: read

jobs:
  molecule:
    name: molecule test (${{ inputs.scenario || 'full-tree' }})
    runs-on: ubuntu-latest
    # A converge across three systemd containers plus mocks; the default
    # 360-minute cap would let a hang burn the whole budget.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the scenario
        working-directory: molecule/${{ inputs.scenario || 'full-tree' }}
        # The scenario installs its own collections via the galaxy
        # dependency block in molecule.yml.
        run: molecule test
