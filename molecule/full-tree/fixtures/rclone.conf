# full-tree-scenario-only override: same section names config.yml (the
# shared molecule/fixtures/stortree/config.yml) references, pointed at
# the mocked sftp/GCS containers instead of a real storage box (spec.md
# §9 "Mocked dependencies").

[storagebox]
type = sftp
host = storagebox-mock
user = stortree
pass = stortree
port = 22

[some-remote]
type = sftp
host = some-remote-mock
user = stortree
pass = stortree
port = 22

# GCS is the one remote the harness can't meaningfully fake locally
# (spec.md §9) -- left unusable here; any subtree resolving to it is
# expected to be skipped/stubbed when running fully offline.
[some-gcs-bucket]
type = google cloud storage
service_account_credentials = {}
